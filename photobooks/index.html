<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Books — Vaish</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@500;700&display=swap');

:root {
  --brown-dark: #2C1810;
  --brown: #4A3728;
  --brown-medium: #6B4E37;
  --brown-light: #8B7355;
  --caramel: #C4944A;
  --golden: #D4A853;
  --terracotta: #C97B63;
  --sage: #7BA69C;
  --cream: #FFF8F0;
  --beige: #F5EDE0;
  --beige-dark: #E8DCC8;
  --sand: #D4B896;
  --white: #FEFCF8;
  --ink: #2C1810;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(135deg, var(--beige) 0%, var(--cream) 40%, var(--sand) 100%);
  min-height: 100vh;
  color: var(--ink);
}

/* Floating particles */
.particle {
  position: fixed;
  width: 5px;
  height: 5px;
  background: var(--caramel);
  border-radius: 50%;
  opacity: 0;
  z-index: 1;
  animation: particleFloat 10s ease-in-out infinite;
  pointer-events: none;
}

@keyframes particleFloat {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.35; }
  90% { opacity: 0.35; }
  100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}

/* Header */
header {
  text-align: center;
  padding: 80px 20px 40px;
  position: relative;
  z-index: 10;
}

header h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(3rem, 7vw, 5rem);
  color: var(--brown);
  text-shadow: 4px 4px 0 var(--caramel), 0 0 40px rgba(196,148,74,0.2);
}

header p {
  font-size: clamp(1rem, 2.5vw, 1.25rem);
  color: var(--brown-medium);
  margin-top: 16px;
}

.nav {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

.nav a {
  color: var(--brown);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  border: 2px solid transparent;
  transition: all 0.2s;
}

.nav a:hover,
.nav a.active {
  border-color: var(--caramel);
  color: var(--caramel);
}

/* Month grid */
.months {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 30px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.month-card {
  background: var(--white);
  border: 2px solid var(--beige-dark);
  border-radius: 24px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: block;
}

.month-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--card-accent, var(--caramel)), transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.month-card:hover::before {
  opacity: 0.06;
}

.month-card:hover {
  transform: translateY(-5px);
  border-color: var(--card-accent, var(--caramel));
  box-shadow: 0 15px 40px rgba(44,24,16,0.12);
}

.month-emoji {
  font-size: 3rem;
  margin-bottom: 12px;
  display: block;
  position: relative;
  z-index: 1;
}

.month-name {
  font-family: 'Caveat', cursive;
  font-size: 1.6rem;
  color: var(--card-accent, var(--brown));
  position: relative;
  z-index: 1;
}

.month-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.7rem;
  font-weight: 600;
  margin-top: 8px;
  position: relative;
  z-index: 1;
}

.month-badge.live {
  background: rgba(123,166,156,0.2);
  color: var(--sage);
  border: 1px solid var(--sage);
}

.month-badge.coming {
  background: rgba(196,148,74,0.2);
  color: var(--brown-medium);
  border: 1px solid var(--caramel);
}

/* Footer */
footer {
  text-align: center;
  padding: 40px 20px 60px;
  position: relative;
  z-index: 10;
}

footer p {
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: var(--brown);
}

footer .sub {
  font-size: 0.85rem;
  color: var(--brown-light);
  margin-top: 6px;
}

/* Wave */
.wave {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60px;
  z-index: 1;
  overflow: hidden;
}

.wave svg {
  position: absolute;
  bottom: 0;
  width: 200%;
  height: 100%;
  animation: waveMove 8s linear infinite;
}

@keyframes waveMove {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
</style>
</head>
<body>

<div class="particle" style="left: 10%; animation-delay: 0s;"></div>
<div class="particle" style="left: 30%; animation-delay: 2s;"></div>
<div class="particle" style="left: 50%; animation-delay: 4s;"></div>
<div class="particle" style="left: 70%; animation-delay: 1s;"></div>
<div class="particle" style="left: 90%; animation-delay: 3s;"></div>

<header>
  <h1>📸 Photo Books</h1>
  <p>Our memories, one month at a time</p>
  <div class="nav">
    <a href="../photobooks/" class="active">📸 Photo Books</a>
    <a href="../about/">💝 About Us</a>
    <a href="../contact/">✉️ Contact Us</a>
  </div>
</header>

<main class="months" id="months">
  <!-- Populated by JS -->
</main>

<footer>
  <p>Made with 🤎</p>
  <p class="sub">Vaish — A collection of us</p>
</footer>

<div class="wave">
  <svg viewBox="0 0 1200 60" preserveAspectRatio="none">
    <path d="M0,30 C150,50 350,10 500,30 C650,50 850,10 1000,30 C1150,50 1200,30 1200,30 L1200,60 L0,60 Z" fill="rgba(212,184,150,0.35)"/>
    <path d="M0,40 C150,20 350,50 500,40 C650,20 850,50 1000,40 C1150,20 1200,40 1200,40 L1200,60 L0,60 Z" fill="rgba(212,184,150,0.18)"/>
  </svg>
</div>

<script>
const months = [
  { name: "August", emoji: "🎸", accent: "#C97B63", live: false },
  { name: "September", emoji: "🍂", accent: "#C4944A", live: false },
  { name: "October", emoji: "🎃", accent: "#D4A853", live: false },
  { name: "November", emoji: "🦃", accent: "#8B7355", live: false },
  { name: "December", emoji: "🎄", accent: "#7BA69C", live: false },
];

const container = document.getElementById('months');

months.forEach((m) => {
  const card = document.createElement('a');
  card.className = 'month-card';
  card.href = '#';
  card.style.setProperty('--card-accent', m.accent);

  card.innerHTML = `
    <span class="month-emoji">${m.emoji}</span>
    <h3 class="month-name">${m.name}</h3>
    <span class="month-badge coming">COMING SOON</span>
  `;

  container.appendChild(card);
});
</script>

</body>
</html>
