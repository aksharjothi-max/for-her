<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Summer of Us ☀️💕</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@500;700&display=swap');

:root {
  --coral: #FF6B6B;
  --coral-light: #FF8E8E;
  --yellow: #FFD93D;
  --yellow-light: #FFE566;
  --teal: #4ECDC4;
  --teal-dark: #3BA99F;
  --sky: #87CEEB;
  --sand: #F5E6CA;
  --cream: #FFF8F0;
  --ink: #2D3436;
  --white: #ffffff;
  --purple: #A78BFA;
  --pink: #F472B6;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, var(--sky) 85%, var(--cream) 100%);
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--ink);
}

/* Shooting stars */
.shooting-star {
  position: fixed;
  width: 100px;
  height: 2px;
  background: linear-gradient(90deg, white, transparent);
  opacity: 0;
  z-index: 1;
  animation: shoot 4s ease-in-out infinite;
}

.shooting-star:nth-child(1) { top: 15%; animation-delay: 0s; }
.shooting-star:nth-child(2) { top: 25%; animation-delay: 1.5s; }
.shooting-star:nth-child(3) { top: 10%; animation-delay: 3s; }

@keyframes shoot {
  0% { transform: translateX(-100px) translateY(0); opacity: 0; }
  10% { opacity: 1; }
  30% { opacity: 0; }
  100% { transform: translateX(calc(100vw + 200px)) translateY(200px); opacity: 0; }
}

/* Floating hearts */
.floating-heart {
  position: fixed;
  font-size: 20px;
  opacity: 0;
  z-index: 1;
  animation: floatUp 8s ease-in-out infinite;
  pointer-events: none;
}

@keyframes floatUp {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}

/* Sun decoration */
body::before {
  content: '';
  position: fixed;
  top: -100px;
  right: -100px;
  width: 350px;
  height: 350px;
  background: radial-gradient(circle, var(--yellow) 0%, var(--yellow-light) 30%, transparent 70%);
  border-radius: 50%;
  opacity: 0.6;
  z-index: 0;
  animation: sunPulse 4s ease-in-out infinite;
}

@keyframes sunPulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.08); opacity: 0.8; }
}

/* Clouds */
.cloud {
  position: fixed;
  background: white;
  border-radius: 50px;
  opacity: 0.2;
  z-index: 0;
  animation: floatCloud 30s linear infinite;
}

.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: white;
  border-radius: 50%;
}

.cloud-1 {
  width: 120px; height: 35px;
  top: 120px; left: -120px;
  animation-duration: 35s;
}
.cloud-1::before { width: 60px; height: 60px; top: -30px; left: 18px; }
.cloud-1::after { width: 42px; height: 42px; top: -22px; left: 66px; }

.cloud-2 {
  width: 90px; height: 28px;
  top: 280px; left: -120px;
  animation-duration: 42s;
  animation-delay: -15s;
}
.cloud-2::before { width: 48px; height: 48px; top: -24px; left: 14px; }
.cloud-2::after { width: 34px; height: 34px; top: -18px; left: 50px; }

@keyframes floatCloud {
  from { transform: translateX(0); }
  to { transform: translateX(calc(100vw + 250px)); }
}

/* Palm trees */
.palm {
  position: fixed;
  bottom: 0;
  width: 70px;
  height: 220px;
  z-index: 0;
}

.palm-trunk {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 160px;
  background: linear-gradient(90deg, #6B4E1A, #8B6914, #6B4E1A);
  border-radius: 6px 6px 0 0;
}

.palm-leaf {
  position: absolute;
  bottom: 140px;
  left: 50%;
  width: 70px;
  height: 28px;
  background: linear-gradient(90deg, var(--teal), var(--teal-dark));
  border-radius: 0 50% 0 50%;
  transform-origin: left center;
  animation: palmSway 3s ease-in-out infinite;
}

.palm-leaf:nth-child(2) { transform: rotate(-30deg); animation-delay: 0.5s; }
.palm-leaf:nth-child(3) { transform: rotate(-90deg); animation-delay: 1s; }
.palm-leaf:nth-child(4) { transform: rotate(-150deg); animation-delay: 1.5s; }
.palm-leaf:nth-child(5) { transform: rotate(30deg); animation-delay: 0.3s; }
.palm-leaf:nth-child(6) { transform: rotate(90deg); animation-delay: 0.8s; }

@keyframes palmSway {
  0%, 100% { transform: rotate(var(--base, -30deg)) translateY(0); }
  50% { transform: rotate(var(--base, -30deg)) translateY(-3px); }
}

.palm-left { left: 15px; }
.palm-right { right: 15px; }

/* Header */
header {
  text-align: center;
  padding: 60px 20px 30px;
  position: relative;
  z-index: 10;
}

header h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(2.8rem, 6vw, 4.5rem);
  color: var(--coral);
  text-shadow: 4px 4px 0 var(--yellow), -2px -2px 0 rgba(0,0,0,0.1);
  animation: titleBounce 0.8s ease;
}

@keyframes titleBounce {
  0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
  60% { transform: scale(1.1) rotate(3deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

header .subtitle {
  font-size: clamp(1rem, 2.5vw, 1.25rem);
  color: var(--cream);
  font-weight: 600;
  margin-top: 12px;
  opacity: 0;
  animation: fadeInUp 0.6s ease 0.4s forwards;
}

header .dates {
  display: inline-block;
  padding: 6px 18px;
  background: rgba(255,255,255,0.15);
  border-radius: 20px;
  color: var(--yellow-light);
  font-size: 0.9rem;
  margin-top: 10px;
  opacity: 0;
  animation: fadeInUp 0.6s ease 0.6s forwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Page dots */
.page-dots {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin: 30px 0 20px;
  position: relative;
  z-index: 10;
  flex-wrap: wrap;
  padding: 0 20px;
}

.page-dot {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 3px solid var(--coral);
  background: rgba(255,255,255,0.9);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--coral);
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-dot:hover {
  background: var(--coral);
  color: white;
  transform: scale(1.1);
}

.page-dot.active {
  background: var(--coral);
  color: white;
  transform: scale(1.2);
  box-shadow: 0 4px 15px rgba(255,107,107,0.4);
}

.page-dot.fully-unlocked {
  background: var(--teal);
  border-color: var(--teal);
  color: white;
}

.page-dot .dot-icon {
  position: absolute;
  top: -10px;
  right: -8px;
  font-size: 14px;
}

/* Book container */
.book-container {
  max-width: 1100px;
  margin: 20px auto;
  padding: 0 30px;
  position: relative;
  z-index: 10;
}

/* Spread layout */
.spread {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  animation: spreadIn 0.6s ease;
}

.spread.active {
  display: grid;
}

@keyframes spreadIn {
  from { opacity: 0; transform: rotateY(-20deg) scale(0.95); }
  to { opacity: 1; transform: rotateY(0) scale(1); }
}

@media (max-width: 768px) {
  .spread.active { grid-template-columns: 1fr; }
  .book-container { padding: 0 15px; }
}

/* Page */
.page {
  background: var(--white);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  position: relative;
  transition: all 0.4s ease;
  border: 4px solid transparent;
}

.page:hover {
  transform: translateY(-6px) rotate(-1deg);
  border-color: var(--yellow);
  box-shadow: 0 15px 50px rgba(0,0,0,0.2);
}

.page-image {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
}

/* Lock overlay */
.lock-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,107,107,0.95), rgba(78,205,196,0.95), rgba(167,139,250,0.95));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  border-radius: 16px;
  padding: 20px;
}

.page.locked .lock-overlay {
  opacity: 1;
  pointer-events: all;
}

.page.unlocked .lock-overlay {
  opacity: 0;
  pointer-events: none;
}

.lock-icon {
  font-size: 72px;
  animation: lockShake 2s ease-in-out infinite;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
}

@keyframes lockShake {
  0%, 100% { transform: rotate(0) scale(1); }
  25% { transform: rotate(-8deg) scale(1.05); }
  75% { transform: rotate(8deg) scale(1.05); }
}

.lock-text {
  color: white;
  font-weight: 700;
  font-size: 1.2rem;
  margin-top: 12px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.3);
  text-align: center;
}

.lock-hint {
  color: rgba(255,255,255,0.85);
  font-size: 0.85rem;
  margin-top: 6px;
  text-align: center;
}

.unlock-btn {
  margin-top: 20px;
  padding: 14px 32px;
  background: var(--yellow);
  border: none;
  border-radius: 30px;
  font-family: 'Fredoka', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.unlock-btn:hover {
  transform: scale(1.08);
  background: var(--yellow-light);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* Trivia modal */
.trivia-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.trivia-backdrop.show {
  display: flex;
}

.trivia-card {
  background: var(--white);
  border-radius: 28px;
  padding: 40px;
  max-width: 480px;
  width: 100%;
  box-shadow: 0 25px 80px rgba(0,0,0,0.4);
  animation: triviaPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

@keyframes triviaPop {
  from { transform: scale(0.6) rotate(-8deg); opacity: 0; }
  to { transform: scale(1) rotate(0); opacity: 1; }
}

.trivia-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: linear-gradient(90deg, var(--coral), var(--yellow), var(--teal), var(--purple), var(--pink));
}

.trivia-card h3 {
  font-family: 'Caveat', cursive;
  font-size: 2.2rem;
  color: var(--coral);
  margin-bottom: 16px;
}

.trivia-card .question {
  font-size: 1.1rem;
  line-height: 1.6;
  margin-bottom: 24px;
  color: var(--ink);
}

.trivia-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.trivia-option {
  padding: 14px 20px;
  border: 3px solid var(--sand);
  border-radius: 14px;
  background: var(--cream);
  font-family: 'Fredoka', sans-serif;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.25s ease;
  text-align: left;
}

.trivia-option:hover {
  border-color: var(--teal);
  background: white;
  transform: translateX(6px);
}

.trivia-option.correct {
  background: #d4edda;
  border-color: #28a745;
  color: #155724;
  transform: scale(1.02);
}

.trivia-option.wrong {
  background: #f8d7da;
  border-color: #dc3545;
  color: #721c24;
}

.trivia-result {
  margin-top: 20px;
  text-align: center;
  font-weight: 700;
  font-size: 1.1rem;
  min-height: 32px;
}

.trivia-result.success { color: #28a745; }
.trivia-result.fail { color: #dc3545; }

.trivia-close {
  margin-top: 20px;
  padding: 14px 32px;
  background: var(--teal);
  border: none;
  border-radius: 30px;
  color: white;
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.2s;
}

.trivia-close:hover { background: var(--teal-dark); transform: scale(1.05); }

/* Page info */
.page-info {
  padding: 20px;
}

.page-info h3 {
  font-family: 'Caveat', cursive;
  font-size: 1.6rem;
  color: var(--coral);
}

.page-info p {
  font-size: 0.95rem;
  color: #666;
  margin-top: 6px;
  line-height: 1.5;
}

.page-date {
  display: inline-block;
  padding: 4px 12px;
  background: var(--yellow-light);
  border-radius: 14px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink);
  margin-top: 8px;
}

.page-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 0.7rem;
  font-weight: 600;
  margin-left: 6px;
}

/* Navigation */
.nav-controls {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 40px 0;
  position: relative;
  z-index: 10;
}

.nav-btn {
  padding: 14px 32px;
  border: none;
  border-radius: 35px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.25s ease;
}

.nav-btn:not(:disabled):hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

.nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.nav-btn.prev { background: var(--white); color: var(--coral); border: 3px solid var(--coral); }
.nav-btn.next { background: var(--coral); color: white; }
.nav-btn.next:hover:not(:disabled) { background: var(--coral-light); }

/* Progress */
.progress-section {
  max-width: 1100px;
  margin: 20px auto 0;
  padding: 0 30px;
  position: relative;
  z-index: 10;
}

.progress-bar {
  height: 10px;
  background: rgba(255,255,255,0.2);
  border-radius: 5px;
  overflow: hidden;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--coral), var(--yellow), var(--teal), var(--purple));
  border-radius: 5px;
  transition: width 0.6s ease;
  width: 0%;
}

.progress-text {
  text-align: center;
  font-size: 0.95rem;
  color: var(--cream);
  font-weight: 600;
  margin-top: 10px;
}

/* Footer */
footer {
  text-align: center;
  padding: 40px 20px 60px;
  position: relative;
  z-index: 10;
}

footer p {
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  color: var(--coral);
}

footer .heart {
  display: inline-block;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.3); }
  30% { transform: scale(1); }
  45% { transform: scale(1.2); }
}

/* Wave decoration */
.wave {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 80px;
  z-index: 1;
  overflow: hidden;
}

.wave svg {
  position: absolute;
  bottom: 0;
  width: 200%;
  height: 100%;
  animation: waveMove 8s linear infinite;
}

@keyframes waveMove {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* Placeholder */
.placeholder-img {
  width: 100%;
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 5rem;
  position: relative;
  overflow: hidden;
}

.placeholder-img::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent1, #FF6B6B), var(--accent2, #FFD93D));
  opacity: 0.12;
}

.placeholder-img span {
  position: relative;
  z-index: 1;
}

/* Confetti */
.confetti {
  position: fixed;
  z-index: 200;
  pointer-events: none;
}

/* Responsive tweaks */
@media (max-width: 480px) {
  header { padding: 40px 15px 20px; }
  .page-dots { gap: 8px; }
  .page-dot { width: 36px; height: 36px; font-size: 0.75rem; }
  .trivia-card { padding: 28px; }
}
</style>
</head>
<body>

<!-- Decorative elements -->
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>

<!-- Floating hearts -->
<div class="floating-heart" style="left: 10%; animation-delay: 0s; animation-duration: 9s;">💕</div>
<div class="floating-heart" style="left: 30%; animation-delay: 2s; animation-duration: 11s;">🌸</div>
<div class="floating-heart" style="left: 50%; animation-delay: 4s; animation-duration: 8s;">💖</div>
<div class="floating-heart" style="left: 70%; animation-delay: 1s; animation-duration: 10s;">✨</div>
<div class="floating-heart" style="left: 90%; animation-delay: 3s; animation-duration: 12s;">💗</div>

<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>

<div class="palm palm-left">
  <div class="palm-trunk"></div>
  <div class="palm-leaf" style="--base: -30deg"></div>
  <div class="palm-leaf" style="--base: -90deg"></div>
  <div class="palm-leaf" style="--base: -150deg"></div>
  <div class="palm-leaf" style="--base: 30deg"></div>
  <div class="palm-leaf" style="--base: 90deg"></div>
</div>

<div class="palm palm-right">
  <div class="palm-trunk"></div>
  <div class="palm-leaf" style="--base: -30deg"></div>
  <div class="palm-leaf" style="--base: -90deg"></div>
  <div class="palm-leaf" style="--base: -150deg"></div>
  <div class="palm-leaf" style="--base: 30deg"></div>
  <div class="palm-leaf" style="--base: 90deg"></div>
</div>

<!-- Header -->
<header>
  <h1>Our Summer of Us ☀️💕</h1>
  <p class="subtitle">From long distance to living together — the summer that changed everything</p>
  <span class="dates">Summer 2025 — Columbus, OH</span>
</header>

<!-- Page dots -->
<div class="page-dots" id="pageDots"></div>

<!-- Book -->
<div class="book-container" id="bookContainer"></div>

<!-- Navigation -->
<div class="nav-controls">
  <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)">◀ Prev</button>
  <button class="nav-btn next" id="nextBtn" onclick="navigate(1)">Next ▶</button>
</div>

<!-- Progress -->
<div class="progress-section">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <p class="progress-text" id="progressText">Unlock 0 of 0 memories</p>
</div>

<!-- Trivia Modal -->
<div class="trivia-backdrop" id="triviaBackdrop">
  <div class="trivia-card">
    <h3 id="triviaTitle">🔒 Memory Lock</h3>
    <p class="question" id="triviaQuestion"></p>
    <div class="trivia-options" id="triviaOptions"></div>
    <div class="trivia-result" id="triviaResult"></div>
    <button class="trivia-close" id="triviaClose" style="display:none;" onclick="closeTrivia()">Continue ✨</button>
  </div>
</div>

<!-- Footer -->
<footer>
  <p>Made with <span class="heart">❤️</span> — the best summer of my life</p>
</footer>

<!-- Wave -->
<div class="wave">
  <svg viewBox="0 0 1200 80" preserveAspectRatio="none">
    <path d="M0,40 C150,60 350,20 500,40 C650,60 850,20 1000,40 C1150,60 1200,40 1200,40 L1200,80 L0,80 Z" fill="rgba(78,205,196,0.4)"/>
    <path d="M0,50 C150,30 350,55 500,50 C650,30 850,55 1000,50 C1150,30 1200,50 1200,50 L1200,80 L0,80 Z" fill="rgba(78,205,196,0.2)"/>
    <path d="M0,60 C200,45 400,70 600,55 C800,40 1000,65 1200,55 L1200,80 L0,80 Z" fill="rgba(78,205,196,0.1)"/>
  </svg>
</div>

<script>
// ============ ALL PAGES DATA ============
const spreads = [
  // SPREAD 1: The Reunion
  {
    left: {
      title: "The Reunion 🤗",
      description: "After months of long distance, I finally touched down in Columbus. First hug in person after forever.",
      emoji: "✈️",
      accent1: "#FF6B6B",
      accent2: "#FFD93D",
      date: "Day 1 — Arrival",
      tag: "Long Distance Ends",
      trivia: {
        question: "How long had we been apart before I flew to Columbus?",
        options: ["1 month", "3 months", "6 months", "Way too long 😭"],
        correct: 3

// ============ STATE ============
let currentPage = 0;
const unlocked = new Set();

// ============ INIT ============
function init() {
  renderBook();
  renderDots();
  updateProgress();
  updateNav();
}

function renderBook() {
  const container = document.getElementById('bookContainer');
  container.innerHTML = '';
  spreads.forEach((spread, i) => {
    const div = document.createElement('div');
    div.className = `spread ${i === 0 ? 'active' : ''}`;
    div.id = `spread-${i}`;
    div.innerHTML = `
      ${renderPage(spread.left, `left-${i}`)}
      ${renderPage(spread.right, `right-${i}`)}
    `;
    container.appendChild(div);
  });
}

function renderPage(page, id) {
  const isUnlocked = unlocked.has(id);
  return `
    <div class="page ${isUnlocked ? 'unlocked' : 'locked'}" id="page-${id}">
      <div class="placeholder-img" style="--accent1: ${page.accent1}; --accent2: ${page.accent2};">
        <span>${page.emoji}</span>
      </div>
      <div class="lock-overlay" id="lock-${id}">
        <div class="lock-icon">🔒</div>
        <div class="lock-text">Unlock this memory</div>
        <div class="lock-hint">Answer a question about us ✨</div>
        <button class="unlock-btn" onclick="openTrivia('${id}')">Unlock Memory</button>
      </div>
      ${isUnlocked ? `
        <div class="page-info">
          <h3>${page.title}</h3>
          <p>${page.description}</p>
          <span class="page-date">${page.date}</span>
          ${page.tag ? `<span class="page-tag" style="background:${page.accent1}22; color:${page.accent1};">${page.tag}</span>` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

function renderDots() {
  const dots = document.getElementById('pageDots');
  dots.innerHTML = '';
  spreads.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = `page-dot ${i === 0 ? 'active' : ''} ${spreadFullyUnlocked(i) ? 'fully-unlocked' : ''}`;
    dot.textContent = i + 1;
    dot.onclick = () => goToPage(i);
    dots.appendChild(dot);
  });
}

function spreadFullyUnlocked(i) {
  return unlocked.has(`left-${i}`) && unlocked.has(`right-${i}`);
}

function navigate(dir) {
  const next = currentPage + dir;
  if (next >= 0 && next < spreads.length) {
    document.getElementById(`spread-${currentPage}`).classList.remove('active');
    currentPage = next;
    document.getElementById(`spread-${currentPage}`).classList.add('active');
    updateDots();
    updateNav();
  }
}

function goToPage(i) {
  document.getElementById(`spread-${currentPage}`).classList.remove('active');
  currentPage = i;
  document.getElementById(`spread-${currentPage}`).classList.add('active');
  updateDots();
  updateNav();
}

function updateDots() {
  document.querySelectorAll('.page-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentPage);
    dot.classList.toggle('fully-unlocked', spreadFullyUnlocked(i));
  });
}

function updateNav() {
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === spreads.length - 1;
}

function updateProgress() {
  const total = spreads.length * 2;
  const done = unlocked.size;
  const pct = total > 0 ? (done / total) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `Unlocked ${done} of ${total} memories ✨`;
}

// ============ TRIVIA ============
let currentTriviaId = null;

function openTrivia(id) {
  currentTriviaId = id;
  const spreadIdx = parseInt(id.split('-')[1]);
  const side = id.split('-')[0];
  const page = spreads[spreadIdx][side === 'left' ? 'left' : 'right'];

  document.getElementById('triviaTitle').textContent = `🔒 ${page.title}`;
  document.getElementById('triviaQuestion').textContent = page.trivia.question;

  const optsDiv = document.getElementById('triviaOptions');
  optsDiv.innerHTML = '';

  page.trivia.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'trivia-option';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, i, page.trivia.correct);
    optsDiv.appendChild(btn);
  });

  document.getElementById('triviaResult').textContent = '';
  document.getElementById('triviaResult').className = 'trivia-result';
  document.getElementById('triviaClose').style.display = 'none';
  document.getElementById('triviaBackdrop').classList.add('show');
}

function checkAnswer(btn, selected, correct) {
  const optsDiv = document.getElementById('triviaOptions');
  const allBtns = optsDiv.querySelectorAll('.trivia-option');
  allBtns.forEach(b => b.onclick = null);

  if (selected === correct) {
    btn.classList.add('correct');
    document.getElementById('triviaResult').textContent = '🎉 Perfect! Memory unlocked!';
    document.getElementById('triviaResult').className = 'trivia-result success';
    document.getElementById('triviaClose').style.display = 'inline-block';
    unlockPage(currentTriviaId);
    fireConfetti();
  } else {
    btn.classList.add('wrong');
    allBtns[correct].classList.add('correct');
    document.getElementById('triviaResult').textContent = 'Close enough — still unlocked because I love you 😘💕';
    document.getElementById('triviaResult').className = 'trivia-result fail';
    document.getElementById('triviaClose').style.display = 'inline-block';
    unlockPage(currentTriviaId);
  }
}

function unlockPage(id) {
  unlocked.add(id);
  const pageEl = document.getElementById(`page-${id}`);
  if (pageEl) {
    pageEl.classList.remove('locked');
    pageEl.classList.add('unlocked');
    const spreadIdx = parseInt(id.split('-')[1]);
    const side = id.split('-')[0];
    const page = spreads[spreadIdx][side === 'left' ? 'left' : 'right'];
    const infoDiv = document.createElement('div');
    infoDiv.className = 'page-info';
    infoDiv.innerHTML = `
      <h3>${page.title}</h3>
      <p>${page.description}</p>
      <span class="page-date">${page.date}</span>
      ${page.tag ? `<span class="page-tag" style="background:${page.accent1}22; color:${page.accent1};">${page.tag}</span>` : ''}
    `;
    pageEl.appendChild(infoDiv);
  }
  updateProgress();
  updateDots();
}

function closeTrivia() {
  document.getElementById('triviaBackdrop').classList.remove('show');
}

// ============ CONFETTI ============
function fireConfetti() {
  const colors = ['#FF6B6B', '#FFD93D', '#4ECDC4', '#FF8E8E', '#87CEEB', '#A78BFA', '#F472B6'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    c.style.width = (Math.random() * 12 + 6) + 'px';
    c.style.height = (Math.random() * 12 + 6) + 'px';
    c.style.animation = `confettiFall ${Math.random() * 2 + 1.5}s linear forwards`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

// Add confetti keyframes dynamically
const style = document.createElement('style');
style.textContent = `
  @keyframes confettiFall {
    to {
      transform: translateY(100vh) rotate(720deg);
      opacity: 0;
    }
  }
`;
document.head.appendChild(style);

// ============ START ============
init();
