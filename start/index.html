<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Start</title>
<style>
:root {
  --brown-dark: #2C1810;
  --brown: #4A3728;
  --brown-medium: #6B4E37;
  --brown-light: #8B7355;
  --caramel: #C4944A;
  --golden: #D4A853;
  --terracotta: #C97B63;
  --sage: #7BA69C;
  --cream: #FFF8F0;
  --beige: #F5EDE0;
  --beige-dark: #E8DCC8;
  --sand: #D4B896;
  --white: #FEFCF8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(180deg, var(--beige) 0%, var(--cream) 50%, var(--sand) 100%);
  min-height: 100vh;
  color: var(--brown-dark);
}

header {
  text-align: center;
  padding: 60px 20px 30px;
}

header h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(2.5rem, 5vw, 4rem);
  color: var(--brown);
  text-shadow: 3px 3px 0 var(--caramel);
}

header p {
  font-size: 1.1rem;
  color: var(--brown-medium);
  margin-top: 8px;
}

.month-bar {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 30px 0;
}

.month-btn {
  padding: 8px 20px;
  border-radius: 20px;
  border: 2px solid var(--caramel);
  background: transparent;
  color: var(--brown);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.month-btn.active, .month-btn:hover {
  background: var(--caramel);
  color: white;
}

.container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 30px;
}

/* Spreads */
.spread {
  display: none;
}

.spread.active {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

/* Pages */
.page {
  background: var(--white);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(44,24,16,0.08);
  position: relative;
  min-height: 400px;
}

.page img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.page-info {
  padding: 18px;
}

.page-info h3 {
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  color: var(--brown);
  margin-bottom: 6px;
}

.page-info p {
  font-size: 0.9rem;
  color: var(--brown-medium);
  line-height: 1.4;
}

/* Photo Grid */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.grid-item {
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(44,24,16,0.08);
  position: relative;
  min-height: 200px;
}

.grid-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Lock Overlay */
.lock-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(74,55,40,0.95), rgba(107,78,55,0.92), rgba(139,115,85,0.92));
  z-index: 10;
}

.unlocked .lock-overlay {
  display: none !important;
}

.locked .lock-overlay {
  display: flex !important;
}

.lock-icon {
  font-size: 3rem;
  margin-bottom: 12px;
}

.lock-text {
  color: var(--cream);
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 4px;
}

.lock-hint {
  color: rgba(255,245,240,0.7);
  font-size: 0.8rem;
  margin-bottom: 16px;
}

.unlock-btn {
  padding: 12px 28px;
  background: var(--caramel);
  border: none;
  border-radius: 28px;
  font-family: 'Fredoka', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: white;
  cursor: pointer;
  transition: all 0.2s;
}

.unlock-btn:hover {
  background: var(--golden);
  transform: scale(1.05);
}

/* Trivia Modal */
.trivia-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(44,24,16,0.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.trivia-backdrop.show {
  display: flex;
}

.trivia-card {
  background: var(--white);
  border-radius: 26px;
  padding: 40px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 25px 70px rgba(44,24,16,0.35);
  animation: triviaPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

@keyframes triviaPop {
  from { transform: scale(0.65) rotate(-6deg); opacity: 0; }
  to { transform: scale(1) rotate(0); opacity: 1; }
}

.trivia-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 7px;
  background: linear-gradient(90deg, var(--caramel), var(--terracotta), var(--golden));
}

.trivia-card h3 {
  font-family: 'Caveat', cursive;
  font-size: 2rem;
  color: var(--brown);
  margin-bottom: 16px;
}

.trivia-card .question {
  font-size: 1.05rem;
  line-height: 1.5;
  margin-bottom: 24px;
  color: var(--brown-dark);
}

.trivia-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.trivia-option {
  padding: 14px 20px;
  border: 3px solid var(--beige-dark);
  border-radius: 14px;
  background: var(--cream);
  font-family: 'Fredoka', sans-serif;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  color: var(--brown-dark);
}

.trivia-option:hover {
  border-color: var(--caramel);
  background: white;
  transform: translateX(5px);
}

.trivia-option.correct {
  background: #d4edda;
  border-color: #28a745;
  color: #155724;
  transform: scale(1.02);
}

.trivia-option.wrong {
  background: #f8d7da;
  border-color: #dc3545;
  color: #721c24;
}

.trivia-result {
  margin-top: 20px;
  text-align: center;
  font-weight: 700;
  font-size: 1.1rem;
  min-height: 32px;
}

.trivia-result.success { color: #28a745; }
.trivia-result.fail { color: #dc3545; }

.trivia-close {
  margin-top: 20px;
  padding: 14px 32px;
  background: var(--brown);
  border: none;
  border-radius: 28px;
  color: var(--cream);
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.2s;
}

.trivia-close:hover { background: var(--brown-medium); transform: scale(1.05); }

/* Progress */
.progress-bar {
  height: 8px;
  background: var(--beige-dark);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 40px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--caramel), var(--golden));
  transition: width 0.5s ease;
}

.progress-text {
  text-align: center;
  margin-top: 8px;
  font-size: 0.85rem;
  color: var(--brown-medium);
}

.controls {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 24px;
}

.controls button {
  padding: 12px 32px;
  border-radius: 28px;
  font-family: 'Fredoka', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-prev {
  background: transparent;
  border: 2px solid var(--caramel);
  color: var(--brown);
}

.btn-next {
  background: var(--caramel);
  border: 2px solid var(--caramel);
  color: white;
}

.btn-prev:hover, .btn-next:hover {
  transform: scale(1.05);
  background: var(--golden);
  border-color: var(--golden);
  color: white;
}

footer {
  text-align: center;
  padding: 40px 20px 60px;
}

footer p {
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: var(--brown);
}
</style>
</head>
<body>

<header>
  <h1>The Start</h1>
  <p>This is where it all started from August to before we were official!</p>
  <div class="month-bar" id="monthBar"></div>
</header>

<main class="container">
  <div id="bookContainer"></div>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
  </div>
  <p class="progress-text" id="progressText">Unlocked 0 of 0 memories</p>
  
  <div class="controls">
    <button class="btn-prev" id="btnPrev">← Prev</button>
    <button class="btn-next" id="btnNext">Next →</button>
  </div>
</main>

<!-- Trivia Modal -->
<div class="trivia-backdrop" id="triviaBackdrop">
  <div class="trivia-card">
    <h3 id="triviaTitle">🔒 Memory Lock</h3>
    <p class="question" id="triviaQuestion"></p>
    <div class="trivia-options" id="triviaOptions"></div>
    <div class="trivia-result" id="triviaResult"></div>
    <button class="trivia-close" id="triviaClose" style="display:none;">Continue</button>
    <button class="trivia-close" id="triviaTryAgain" style="display:none;">Try Again</button>
  </div>
</div>

<footer>
  <p>Made with 🤎 — Where it all began</p>
</footer>

<script>
// Data
const spreads = [
  {
    month: "August",
    left: {
      title: "Flirtatiousness",
      description: "I was in Tennessee, we were closer than ever. The wedding vibes started to get to me and that caused a shift.",

    },
    right: {
      title: "Falling for Each Other",
      description: "First time sleeping on FaceTime together. I didn't want to hang up and faked being asleep, and you just stayed.",
      image: "./images/image_1.jpg",
      accent1: "#D4A853", accent2: "#C97B63",

      trivia: { question: "What date did we first sleep on FaceTime?", options: ["August 20", "August 25", "August 30", "September 1"], correct: 1 }
    }
  },
  {
    month: "September",
    left: {
      title: "September 16 😏",
      description: "You forgot your nighty and just crawled across the room to your camera on FaceTime. Completely naked. I couldn't look away.",
      image: "./images/image_2.jpg",
      accent1: "#C97B63", accent2: "#6B4E37",
      date: "September 16, 2025", tag: "Oops",
      trivia: { question: "What happened on September 16 during our FaceTime?", options: ["You crawled across the room naked", "You gave a dance performance", "You fell asleep on camera", "You ordered food naked"], correct: 0 }
    },
    right: {
      title: "Akshar's First 'I Love You' ❤️",
      description: "First time I said 'I love you' to you. Three words that changed everything for me. Distance can keep us apart but not my feelings for you.",
      image: "./images/image_3.jpg",
      accent1: "#D4A853", accent2: "#C97B63",
      trivia: { question: "What date did Akshar first say 'I love you'?", options: ["September 16", "September 18", "September 20", "September 22"], correct: 1 }
    }
  },
  {
    month: "October",
    left: {
      title: "Your First 'I Love You' ❤️",
      description: "The day you said 'I love you' for the first time. The words you finally decided to say back after two long weeks.",
      image: "./images/image_4.jpg",
      accent1: "#D4A853", accent2: "#C97B63",
      trivia: { question: "What date did you first say 'I love you'?", options: ["October 2", "October 5", "October 10", "October 17"], correct: 0 }
    },
    right: {
      title: "Our First Kiss 💋",
      description: "The day we kissed each other for the first time. Kisses on FaceTime never felt enough after this.",
      image: "./images/image_5.jpg",
      accent1: "#D4A853", accent2: "#C97B63",
      date: "October 17, 2025", tag: "Firsts",
      trivia: { question: "What date was our first kiss?", options: ["October 10", "October 12", "October 17", "October 20"], correct: 2 }
    }
  },
  {
    month: "November",
    left: {
      title: "Thankful for Each Other 🦃",
      description: "Our first ever Thanksgiving together. No turkey this year but we were just thankful for each other.",
      image: "./images/image_6.jpg",
      accent1: "#C4944A", accent2: "#C97B63",
      date: "November 27, 2025", tag: "First Thanksgiving",
      trivia: { question: "What occasion was it where we were thankful for each other?", options: ["First Christmas", "First Thanksgiving", "First Halloween", "First New Year"], correct: 1 }
    },
    right: {
      type: "photogrid",
      description: "Nothing insane happened in November but we still have all these memories to account for us this month.",
      photos: [
        {
          accent1: "#C4944A", accent2: "#C97B63",
          image: "./images/image_7.jpg",
          description: "One of many times seeing you eat KFC on the way back home",
          trivia: { question: "What were you wearing the first night we slept on FaceTime?", options: ["Brown shirt", "Red nighty", "Green Nighty", "Pajamas"], correct: 1 }
        },
        {
          accent1: "#C97B63", accent2: "#D4A853",
          trivia: { question: "What state do I live in?", options: ["Texas", "Ohio", "Tennessee", "Florida"], correct: 0 }
        },
        {
          accent1: "#8B7355", accent2: "#C4944A",
          image: "./images/image_8.jpg",
          description: "Making egg bites ft Archer Kitchen",
          trivia: { question: "What is your favorite pose when making egg bites?", options: ["Crab", "Manspreading", "Monkey", "The Egg-ecutive"], correct: 0 }
        }
      ]
    }
  },
  {
    month: "December",
    layout: "three-cards",
    cards: [
      {
        title: "Akshar's Arrival to John Glenn ✈️",
        description: "My first trip to Columbus, Ohio. The name John Glenn holds a special place in our relationship.",
        image: "./images/image_9.jpg",
        accent1: "#7BA69C", accent2: "#C97B63",
        date: "December 24, 2025", tag: "Arrival",
        trivia: { question: "What date did Akshar arrive at John Glenn Columbus?", options: ["December 22", "December 23", "December 24", "December 26"], correct: 2 }
      },
      {
        title: "Santa Came to Town (as Akshar) 🎅",
        description: "Our first Christmas together. He came, he saw, he gave all the presents.",
        image: "./images/image_10.jpg",
        accent1: "#C97B63", accent2: "#7BA69C",
        date: "December 25, 2025", tag: "First Christmas",
        trivia: { question: "What occasion did we celebrate on December 25?", options: ["Thanksgiving", "New Year", "Christmas", "Valentine's"], correct: 2 }
      },
      {
        title: "Our First Date Ever 🌹",
        description: "The first date planned by you, started off extremely unplanned but that made it better.",
        image: "./images/image_11.jpg",
        accent1: "#D4A853", accent2: "#C97B63",
        date: "December 26, 2025", tag: "First Date",
        trivia: { question: "What color dress did you wear on our first date?", options: ["Brown 🤎", "Black 🖤", "White 🤍", "Red ❤️"], correct: 0 }
      }
    ]
  }
];

// State
let currentPage = 0;
const unlocked = new Set();

// DOM Elements
const bookContainer = document.getElementById('bookContainer');
const monthBar = document.getElementById('monthBar');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const triviaBackdrop = document.getElementById('triviaBackdrop');
const triviaOptions = document.getElementById('triviaOptions');
const triviaResult = document.getElementById('triviaResult');
const triviaClose = document.getElementById('triviaClose');
const triviaTryAgain = document.getElementById('triviaTryAgain');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');

let currentTriviaId = null;

// Initialize
function init() {
  const saved = localStorage.getItem('start-unlocked');
  if (saved) JSON.parse(saved).forEach(id => unlocked.add(id));
  
  const savedPage = localStorage.getItem('start-currentPage');
  if (savedPage) currentPage = parseInt(savedPage);
  
  renderMonthBar();
  renderBook();
  updateProgress();
}

// Render month buttons
function renderMonthBar() {
  monthBar.innerHTML = '';
  spreads.forEach((spread, i) => {
    const btn = document.createElement('button');
    btn.className = `month-btn ${i === currentPage ? 'active' : ''}`;
    btn.textContent = spread.month.substring(0, 3).toUpperCase();
    btn.onclick = () => goToPage(i);
    monthBar.appendChild(btn);
  });
}

// Render book
function renderBook() {
  bookContainer.innerHTML = '';
  spreads.forEach((spread, i) => {
    const div = document.createElement('div');
    div.className = `spread ${i === currentPage ? 'active' : ''}`;
    div.id = `spread-${i}`;
    
    if (spread.type === 'photogrid') {
      div.innerHTML = `
        <div class="photo-grid-desc" style="grid-column:1/-1; text-align:center; padding:20px; font-size:1rem; color:var(--brown-medium); font-weight:600;">
          ${spread.description}
        </div>
        <div class="photo-grid">
          ${spread.photos.map((photo, pi) => renderGridItem(photo, i, pi)).join('')}
        </div>
      `;
    } else if (spread.layout === 'three-cards') {
      div.innerHTML = spread.cards.map((card, ci) => renderPage(card, `card-${i}-${ci}`)).join('');
    } else if (spread.right && spread.right.type === 'photogrid') {
      div.innerHTML = `
        ${renderPage(spread.left, `left-${i}`)}
        <div class="photo-grid-container">
          <div style="text-align:center; padding:8px; font-size:0.9rem; color:var(--brown-medium); font-weight:600; margin-bottom:8px;">
            ${spread.right.description}
          </div>
          <div class="photo-grid">
            ${spread.right.photos.map((photo, pi) => renderGridItem(photo, i, pi)).join('')}
          </div>
        </div>
      `;
    } else {
      div.innerHTML = `
        ${renderPage(spread.left, `left-${i}`)}
        ${renderPage(spread.right, `right-${i}`)}
      `;
    }
    
    bookContainer.appendChild(div);
  });
}

// Render page
function renderPage(page, id) {
  const isUnlocked = unlocked.has(id);
  const hasImage = page.image || page.img;
  
  let imgHtml;
  if (hasImage && isUnlocked) {
    imgHtml = `<img src="${hasImage}" />`;
  } else if (!isUnlocked) {
    imgHtml = `<div style="width:100%; height:400px; background:var(--beige);"></div>`;
  } else {
    imgHtml = `<div style="width:100%; height:400px; background:var(--beige);"></div>`;
  }
  
  const lockHtml = !isUnlocked ? `
    <div class="lock-overlay">
      <div class="lock-icon">🔒</div>
      <div class="lock-text">Unlock this memory</div>
      <div class="lock-hint">Answer a question about us</div>
      <button class="unlock-btn" onclick="openTrivia('${id}')">Unlock Memory</button>
    </div>
  ` : '';
  
  return `
    <div class="page ${isUnlocked ? 'unlocked' : 'locked'}" id="page-${id}">
      ${imgHtml}
      ${lockHtml}
      ${isUnlocked ? `
        <div class="page-info">
          <h3>${page.title}</h3>
          <p>${page.description}</p>
          <span>${page.date}</span>
          ${page.tag ? `<span style="background:${page.accent1}22; color:${page.accent1}; padding:3px 10px; border-radius:10px; font-size:0.7rem; margin-left:6px; font-weight:600;">${page.tag}</span>` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

// Render grid item
function renderGridItem(photo, spreadIdx, photoIdx) {
  const id = `grid-${spreadIdx}-${photoIdx}`;
  const isUnlocked = unlocked.has(id);
  const hasImage = photo.image;
  
  let imgHtml;
  if (hasImage && isUnlocked) {
    imgHtml = `<img src="${hasImage}" />`;
  } else if (!isUnlocked) {
    imgHtml = `<div style="width:100%; height:200px; background:var(--beige);"></div>`;
  } else {
    imgHtml = `<div style="width:100%; height:200px; background:var(--beige);"></div>`;
  }
  
  const lockHtml = !isUnlocked && photo.trivia ? `
    <div class="lock-overlay">
      <div class="lock-icon">🔒</div>
      <button class="unlock-btn" onclick="openGridTrivia('${id}', ${spreadIdx}, ${photoIdx})">Unlock</button>
    </div>
  ` : '';
  
  return `
    <div class="grid-item ${isUnlocked ? 'unlocked' : 'locked'}" id="page-${id}">
      ${imgHtml}
      ${lockHtml}
      ${isUnlocked && photo.description ? `<div style="padding:12px; text-align:center;"><p style="font-size:0.85rem; color:#333; font-weight:600;">${photo.description}</p></div>` : ''}
    </div>
  `;
}

// Update progress
function updateProgress() {
  const total = spreads.reduce((acc, s) => {
    if (s.cards) return acc + s.cards.length;
    if (s.right && s.right.photos) return acc + 1 + s.right.photos.length;
    return acc + 2;
  }, 0);
  const done = unlocked.size;
  const pct = total > 0 ? (done / total) * 100 : 0;
  progressFill.style.width = pct + '%';
  progressText.textContent = `Unlocked ${done} of ${total} memories`;
}

// Navigation
function goToPage(idx) {
  document.querySelectorAll('.spread').forEach(s => s.classList.remove('active'));
  const spread = document.getElementById(`spread-${idx}`);
  if (spread) spread.classList.add('active');
  
  currentPage = idx;
  localStorage.setItem('start-currentPage', currentPage);
  
  // Update month buttons
  document.querySelectorAll('.month-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });
}

btnPrev.onclick = () => {
  if (currentPage > 0) goToPage(currentPage - 1);
};

btnNext.onclick = () => {
  if (currentPage < spreads.length - 1) goToPage(currentPage + 1);
};

// Trivia functions
function openTrivia(id) {
  const parts = id.split('-');
  let page = null;
  
  if (parts[0] === 'card') {
    const spreadIdx = parseInt(parts[1]);
    const cardIdx = parseInt(parts[2]);
    if (spreads[spreadIdx] && spreads[spreadIdx].cards && spreads[spreadIdx].cards[cardIdx]) {
      page = spreads[spreadIdx].cards[cardIdx];
    }
  } else {
    const spreadIdx = parseInt(parts[1]);
    const side = parts[0];
    if (spreads[spreadIdx]) {
      page = spreads[spreadIdx][side];
    }
  }
  
  if (!page || !page.trivia) return;
  
  showTrivia(id, page.trivia, page.title);
}

function openGridTrivia(id, spreadIdx, photoIdx) {
  const spread = spreads[spreadIdx];
  const photos = spread.photos || (spread.right && spread.right.photos) || [];
  const photo = photos[photoIdx];
  if (!photo || !photo.trivia) return;
  
  showTrivia(id, photo.trivia, "Memory Lock");
}

function showTrivia(id, trivia, title) {
  currentTriviaId = id;
  
  document.getElementById('triviaTitle').textContent = `🔒 ${title}`;
  document.getElementById('triviaQuestion').textContent = trivia.question;
  triviaResult.textContent = '';
  triviaResult.className = 'trivia-result';
  triviaClose.style.display = 'none';
  triviaTryAgain.style.display = 'none';
  
  triviaOptions.innerHTML = '';
  trivia.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'trivia-option';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, i, trivia.correct, id);
    triviaOptions.appendChild(btn);
  });
  
  triviaBackdrop.classList.add('show');
}

function checkAnswer(btn, selected, correct, id) {
  const allBtns = triviaOptions.querySelectorAll('.trivia-option');
  allBtns.forEach(b => b.onclick = null);
  
  if (selected === correct) {
    btn.classList.add('correct');
    triviaResult.textContent = '🎉 Perfect! Memory unlocked!';
    triviaResult.className = 'trivia-result success';
    triviaClose.style.display = 'inline-block';
    triviaTryAgain.style.display = 'none';
    
    unlocked.add(id);
    localStorage.setItem('start-unlocked', JSON.stringify([...unlocked]));
    fireConfetti();
  } else {
    btn.classList.add('wrong');
    triviaResult.textContent = 'Try again 😢';
    triviaResult.className = 'trivia-result fail';
    triviaClose.style.display = 'none';
    triviaTryAgain.style.display = 'inline-block';
  }
}

function closeTrivia() {
  triviaBackdrop.classList.remove('show');
  renderBook();
  updateProgress();
}

function tryAgain() {
  triviaTryAgain.style.display = 'none';
  triviaBackdrop.classList.remove('show');
  if (currentTriviaId) {
    const parts = currentTriviaId.split('-');
    if (parts[0] === 'grid') {
      openGridTrivia(currentTriviaId, parseInt(parts[1]), parseInt(parts[2]));
    } else {
      openTrivia(currentTriviaId);
    }
  }
}

// Confetti effect
function fireConfetti() {
  const colors = ['#C4944A', '#D4A853', '#C97B63', '#8B7355', '#6B4E37'];
  for (let i = 0; i < 45; i++) {
    const c = document.createElement('div');
    c.style.cssText = `position:fixed; left:${Math.random()*100}vw; top:-20px; background:${colors[Math.floor(Math.random()*colors.length)]}; border-radius:${Math.random()>0.5?'50%':'3px'}; width:${Math.random()*10+6}px; height:${Math.random()*10+6}px; z-index:200; pointer-events:none; animation:confettiFall ${Math.random()*2+1.5}s linear forwards`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

// Add confetti animation
const style = document.createElement('style');
style.textContent = '@keyframes confettiFall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }';
document.head.appendChild(style);

// Initialize
init();
</script>
