<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Start</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@500;700&display=swap');

:root {
  --brown-dark: #2C1810;
  --brown: #4A3728;
  --brown-medium: #6B4E37;
  --brown-light: #8B7355;
  --caramel: #C4944A;
  --golden: #D4A853;
  --terracotta: #C97B63;
  --sage: #7BA69C;
  --cream: #FFF8F0;
  --beige: #F5EDE0;
  --beige-dark: #E8DCC8;
  --sand: #D4B896;
  --white: #FEFCF8;
  --ink: #2C1810;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(180deg, var(--beige) 0%, var(--cream) 50%, var(--sand) 100%);
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--ink);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 30%, rgba(196,148,74,0.1) 0%, transparent 50%),
              radial-gradient(circle at 80% 70%, rgba(201,123,99,0.08) 0%, transparent 50%);
  z-index: 0;
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed;
  top: -60px;
  right: -60px;
  width: 220px;
  height: 220px;
  background: radial-gradient(circle, var(--golden) 0%, var(--caramel) 40%, transparent 70%);
  border-radius: 50%;
  opacity: 0.45;
  z-index: 0;
  animation: sunPulse 4s ease-in-out infinite;
}

@keyframes sunPulse {
  0%, 100% { transform: scale(1); opacity: 0.45; }
  50% { transform: scale(1.08); opacity: 0.65; }
}

.particle {
  position: fixed;
  width: 4px;
  height: 4px;
  background: var(--caramel);
  border-radius: 50%;
  opacity: 0;
  z-index: 1;
  animation: particleFloat 9s ease-in-out infinite;
  pointer-events: none;
}

@keyframes particleFloat {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.4; }
  90% { opacity: 0.4; }
  100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}

header {
  text-align: center;
  padding: 50px 20px 25px;
  position: relative;
  z-index: 10;
}

header h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(2.5rem, 5vw, 4rem);
  color: var(--brown);
  text-shadow: 3px 3px 0 var(--caramel), -1px -1px 0 rgba(0,0,0,0.05);
  animation: titleBounce 0.7s ease;
}

@keyframes titleBounce {
  0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
  60% { transform: scale(1.08) rotate(2deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

header .subtitle {
  font-size: clamp(0.9rem, 2vw, 1.15rem);
  color: var(--brown-medium);
  font-weight: 600;
  margin-top: 8px;
  opacity: 0;
  animation: fadeInUp 0.5s ease 0.3s forwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-dots {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 20px 0;
  position: relative;
  z-index: 10;
  flex-wrap: wrap;
}

.page-dot {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid var(--caramel);
  background: var(--white);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--brown);
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-dot.active {
  background: var(--caramel);
  color: white;
  transform: scale(1.2);
}

.page-dot.fully-unlocked {
  background: var(--sage);
  border-color: var(--sage);
  color: white;
}

.book-container {
  max-width: 1000px;
  margin: 20px auto;
  padding: 0 20px;
  position: relative;
  z-index: 10;
}

.spread {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  animation: spreadIn 0.5s ease;
}

.spread.active {
  display: grid;
}

@keyframes spreadIn {
  from { opacity: 0; transform: rotateY(-15deg); }
  to { opacity: 1; transform: rotateY(0); }
}

@media (max-width: 700px) {
  .spread.active { grid-template-columns: 1fr; }
}

.page {
  background: var(--white);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(44,24,16,0.08);
  position: relative;
  transition: transform 0.3s ease, border-color 0.3s ease;
  border: 4px solid transparent;
}

.page:hover {
  transform: translateY(-5px) rotate(-1deg);
  border-color: var(--caramel);
}

.lock-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(74,55,40,0.95), rgba(107,78,55,0.92), rgba(139,115,85,0.92));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  border-radius: 14px;
  padding: 20px;
}

.page.locked .lock-overlay {
  opacity: 1;
  pointer-events: all;
}

.lock-icon {
  font-size: 64px;
  animation: lockShake 2s ease-in-out infinite;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
}

@keyframes lockShake {
  0%, 100% { transform: rotate(0) scale(1); }
  25% { transform: rotate(-5deg) scale(1.05); }
  75% { transform: rotate(5deg) scale(1.05); }
}

.lock-text {
  color: var(--cream);
  font-weight: 700;
  font-size: 1.15rem;
  margin-top: 10px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}

.lock-hint {
  color: rgba(255,248,240,0.8);
  font-size: 0.8rem;
  margin-top: 5px;
}

.unlock-btn {
  margin-top: 18px;
  padding: 12px 28px;
  background: var(--caramel);
  border: none;
  border-radius: 28px;
  font-family: 'Fredoka', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: white;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.unlock-btn:hover {
  transform: scale(1.06);
  background: var(--golden);
}

.trivia-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(44,24,16,0.7);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.trivia-backdrop.show {
  display: flex;
}

.trivia-card {
  background: var(--white);
  border-radius: 26px;
  padding: 36px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 25px 70px rgba(44,24,16,0.35);
  animation: triviaPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

@keyframes triviaPop {
  from { transform: scale(0.65) rotate(-6deg); opacity: 0; }
  to { transform: scale(1) rotate(0); opacity: 1; }
}

.trivia-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 7px;
  background: linear-gradient(90deg, var(--caramel), var(--terracotta), var(--golden));
}

.trivia-card h3 {
  font-family: 'Caveat', cursive;
  font-size: 2rem;
  color: var(--brown);
  margin-bottom: 14px;
}

.trivia-card .question {
  font-size: 1.05rem;
  line-height: 1.5;
  margin-bottom: 22px;
  color: var(--ink);
}

.trivia-options {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.trivia-option {
  padding: 13px 18px;
  border: 3px solid var(--beige-dark);
  border-radius: 13px;
  background: var(--cream);
  font-family: 'Fredoka', sans-serif;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  color: var(--ink);
}

.trivia-option:hover {
  border-color: var(--caramel);
  background: white;
  transform: translateX(5px);
}

.trivia-option.correct {
  background: #d4edda;
  border-color: #28a745;
  color: #155724;
  transform: scale(1.02);
}

.trivia-option.wrong {
  background: #f8d7da;
  border-color: #dc3545;
  color: #721c24;
}

.trivia-result {
  margin-top: 18px;
  text-align: center;
  font-weight: 700;
  font-size: 1.05rem;
  min-height: 30px;
}

.trivia-result.success { color: #28a745; }
.trivia-result.fail { color: #dc3545; }

.trivia-close {
  margin-top: 18px;
  padding: 12px 28px;
  background: var(--brown);
  border: none;
  border-radius: 28px;
  color: var(--cream);
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
}

.trivia-close:hover { background: var(--brown-medium); transform: scale(1.05); }

#triviaImage {
  text-align: center;
  margin-top: 12px;
}

.page-info {
  padding: 18px;
}

.page-info h3 {
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  color: var(--brown);
}

.page-info p {
  font-size: 0.9rem;
  color: #666;
  margin-top: 5px;
  line-height: 1.45;
}

.page-date {
  display: inline-block;
  padding: 4px 11px;
  background: var(--beige-dark);
  border-radius: 13px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--brown);
  margin-top: 7px;
}

.nav-controls {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin: 35px 0;
  position: relative;
  z-index: 10;
}

.nav-btn {
  padding: 13px 30px;
  border: none;
  border-radius: 32px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.nav-btn:not(:disabled):hover {
  transform: translateY(-3px);
  box-shadow: 0 7px 22px rgba(44,24,16,0.15);
}

.nav-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.nav-btn.prev { background: var(--white); color: var(--brown); border: 3px solid var(--caramel); }
.nav-btn.next { background: var(--brown); color: var(--cream); }
.nav-btn.next:hover:not(:disabled) { background: var(--brown-medium); }

.progress-section {
  max-width: 1000px;
  margin: 18px auto 0;
  padding: 0 20px;
  position: relative;
  z-index: 10;
}

.progress-bar {
  height: 9px;
  background: var(--beige-dark);
  border-radius: 5px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--caramel), var(--golden), var(--terracotta));
  border-radius: 5px;
  transition: width 0.5s ease;
  width: 0%;
}

.progress-text {
  text-align: center;
  font-size: 0.88rem;
  color: var(--brown-medium);
  font-weight: 600;
  margin-top: 9px;
}

footer {
  text-align: center;
  padding: 35px 20px 55px;
  position: relative;
  z-index: 10;
}

footer p {
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: var(--brown);
}

footer .heart {
  display: inline-block;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.25); }
  30% { transform: scale(1); }
  45% { transform: scale(1.15); }
}

.placeholder-img {
  width: 100%;
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4.5rem;
  position: relative;
  overflow: hidden;
}

.placeholder-img::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent1, #6B4E37), var(--accent2, #C4944A));
  opacity: 0.12;
}

/* Three-card layout */
.three-cards {
  grid-template-columns: repeat(3, 1fr);
}

@media (max-width: 700px) {
  .three-cards {
    grid-template-columns: 1fr;
  }
}

/* Photo grid */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
}

.photo-grid-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.grid-item {
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(44,24,16,0.08);
  position: relative;
  transition: transform 0.3s ease, border-color 0.3s ease;
  border: 4px solid transparent;
  cursor: pointer;
}

.grid-item:hover {
  transform: translateY(-4px) rotate(-1deg);
  border-color: var(--caramel);
}

.grid-item.locked .lock-overlay {
  opacity: 1;
  pointer-events: all;
}

.lock-overlay .lock-icon {
  font-size: 36px;
  margin-bottom: 8px;
}

.confetti {
  position: fixed;
  z-index: 200;
  pointer-events: none;
}

@media (max-width: 480px) {
  .trivia-card { padding: 24px; }
  .page-dots { gap: 8px; }
  .page-dot { width: 34px; height: 34px; font-size: 0.72rem; }
}
</style>
</head>
<body>

<div class="particle" style="left: 15%; animation-delay: 0s;"></div>
<div class="particle" style="left: 35%; animation-delay: 3s;"></div>
<div class="particle" style="left: 55%; animation-delay: 1s;"></div>
<div class="particle" style="left: 75%; animation-delay: 5s;"></div>
<div class="particle" style="left: 90%; animation-delay: 2s;"></div>

<header>
  <h1>The Start</h1>
  <p class="subtitle">This is where it all started from August to before we were official!</p>
</header>

<div class="page-dots" id="pageDots"></div>

<div class="book-container" id="bookContainer"></div>

<div class="nav-controls">
  <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)">◀ Prev</button>
  <button class="nav-btn next" id="nextBtn" onclick="navigate(1)">Next ▶</button>
</div>

<div class="progress-section">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <p class="progress-text" id="progressText">Unlock 0 of 0 memories</p>
</div>

<div style="text-align: center; margin: 20px 0;">
  <button onclick="clearAllProgress()" style="padding:10px 24px; background:transparent; border:2px solid var(--brown); border-radius:25px; font-family:'Fredoka'; font-weight:700; font-size:1rem; color:var(--brown); cursor:pointer;">Clear All Progress</button>
</div>

<div class="trivia-backdrop" id="triviaBackdrop">
  <div class="trivia-card">
    <h3 id="triviaTitle">🔒 Memory Lock</h3>
    <p class="question" id="triviaQuestion"></p>
    <div class="trivia-options" id="triviaOptions"></div>
    <div class="trivia-result" id="triviaResult"></div>
    <div id="triviaImage" style="display:none;"></div>
    <button class="trivia-close" id="triviaClose" style="display:none;" onclick="closeTrivia()">Continue</button>
    <button class="trivia-close" id="triviaTryAgain" style="display:none;" onclick="tryAgain()">Try Again</button>
  </div>
</div>

<footer>
  <p>Made with <span class="heart">🤎</span> — Where it all began</p>
</footer>

<script>
const spreads = [
  {
    month: "August",
    left: {
      title: "Flirtatiousness",
      description: "It started in Tennessee — I was at a wedding, she was still in Ohio. But something shifted. Messages got longer, calls got later, and suddenly we weren't just friends anymore.",
      accent1: "#6B4E37", accent2: "#C97B63",

      title: "August 25: First Kiss",

  {
    month: "September",
    left: {
      title: "September 16 😏",
      description: "She forgot her nighty and just crawled across the room to her camera on FaceTime. Completely naked. I couldn't look away.",
      accent1: "#C97B63", accent2: "#6B4E37",
      date: "September 16, 2025", tag: "Oops",
      trivia: { question: "What happened on September 16 during our FaceTime?", options: ["She crawled across the room naked", "She gave a dance performance", "She fell asleep on camera", "She ordered food naked"], correct: 0 }
    },
    right: {
      title: "September 18 — Akshar's First 'I Love You' ❤️",
      description: "First time I said 'I love you' to her. Three words that changed everything. Distance didn't matter anymore — this was real.",
      accent1: "#C4944A", accent2: "#C97B63",
      date: "September 18, 2025", tag: "Milestone",
      trivia: { question: "What date did Akshar first say 'I love you'?", options: ["September 16", "September 18", "October 2", "October 17"], correct: 1 }
    }
  },
  {
    month: "October",
    left: {
      title: "Vaishnavi's First 'I Love You' ❤️",
      description: "The day she said 'I love you' for the first time. The words I'd been waiting to hear.",
      accent1: "#C97B63", accent2: "#C4944A",
      date: "October 2, 2025", tag: "Milestone",
      trivia: { question: "What date did Vaishnavi first say 'I love you'?", options: ["September 18", "October 2", "October 17", "November 27"], correct: 1 }
    },
    right: {
      title: "October 17 — First Kiss 💋",
      description: "The day we had our actual first kiss. Not on FaceTime — for real.",
      accent1: "#D4A853", accent2: "#C97B63",
      date: "October 17, 2025", tag: "Firsts",

    }
  },
  {

      description: "Our first ever Thanksgiving together. No turkey this year but we were just thankful for each other.",
      accent1: "#C4944A", accent2: "#C97B63",
      date: "November 27, 2025", tag: "First Thanksgiving",
      trivia: { question: "What occasion was it where we were thankful for each other?", options: ["First Christmas", "First Thanksgiving", "First Halloween", "First New Year"], correct: 1 }
    },
    right: {
      type: "photogrid",
      description: "Nothing insane happened in november but we still have all these memories to account for us this month.",
      photos: [
        { accent1: "#C4944A", accent2: "#C97B63", trivia: { question: "What is my favorite color?", options: ["Brown", "Blue", "Green", "Red"], correct: 0 } },
        { accent1: "#C97B63", accent2: "#D4A853", trivia: { question: "What state do I live in?", options: ["Texas", "Ohio", "Tennessee", "Florida"], correct: 0 } },
        { accent1: "#8B7355", accent2: "#C4944A", trivia: { question: "What do I study?", options: ["Business Analytics & AI", "Computer Science", "Finance", "Engineering"], correct: 0 } }
      ]
    }
  },
  {
    month: "December",
    layout: "three-cards",
    cards: [
      {
        title: "December 24 — Arrived in Ohio 🏠",
        description: "The first time I flew to Ohio. The start of living together. Best landing of my life.",
        accent1: "#7BA69C", accent2: "#C97B63",
        date: "December 24, 2025", tag: "First in Ohio",
        trivia: { question: "What happened on December 24?", options: ["I flew to Ohio for the first time", "Our first Christmas together", "Our first date together", "We met her parents"], correct: 0 }
      },
      {
        title: "December 25 — Our First Christmas 🎄",
        description: "Our first Christmas together. Spending the holidays side by side instead of on a screen.",
        accent1: "#C97B63", accent2: "#7BA69C",
        date: "December 25, 2025", tag: "First Christmas",

      },
      {
        title: "December 26 — First Date Ever 🌹",
        description: "Our first real date, planned entirely by Vaishnavi. She made it perfect.",
        accent1: "#D4A853", accent2: "#C97B63",
        date: "December 26, 2025", tag: "First Date",
        trivia: { question: "What happened on December 26?", options: ["First Christmas", "First meeting", "First date ever", "First movie"], correct: 2 }
      }
    ]
  }
];

let currentPage = 0;
const unlocked = new Set();

function init() {
  const savedUnlocked = localStorage.getItem('start-unlocked');
  if (savedUnlocked) {
    JSON.parse(savedUnlocked).forEach(id => unlocked.add(id));
  }
  const savedPage = localStorage.getItem('start-currentPage');
  if (savedPage) currentPage = parseInt(savedPage);
  renderBook();
  renderDots();
  updateProgress();
  updateNav();
  document.querySelectorAll('.spread').forEach(s => s.classList.remove('active'));
  const savedSpread = document.getElementById(`spread-${currentPage}`);
  if (savedSpread) savedSpread.classList.add('active');
  updateDots();
}

function renderBook() {
  const container = document.getElementById('bookContainer');
  container.innerHTML = '';
  spreads.forEach((spread, i) => {
    if (spread.type === 'photogrid') {
      const div = document.createElement('div');
      div.className = `spread ${i === 0 ? 'active' : ''}`;
      div.id = `spread-${i}`;
      div.innerHTML = `
        <div class="photo-grid-desc" style="grid-column:1/-1; text-align:center; padding:20px; font-size:1rem; color:var(--brown-medium); font-weight:600;">
          ${spread.description}
        </div>
        <div class="photo-grid">
          ${spread.photos.map((photo, pi) => renderGridItem(photo, i, pi)).join('')}
        </div>
      `;
      container.appendChild(div);
    } else if (spread.layout === 'three-cards') {
      const div = document.createElement('div');
      div.className = `spread three-cards ${i === 0 ? 'active' : ''}`;
      div.id = `spread-${i}`;
      div.innerHTML = spread.cards.map((card, ci) => renderPage(card, `card-${i}-${ci}`)).join('');
      container.appendChild(div);
    } else if (spread.right && spread.right.type === 'photogrid') {
      const div = document.createElement('div');
      div.className = `spread ${i === 0 ? 'active' : ''}`;
      div.id = `spread-${i}`;
      div.innerHTML = `
        ${renderPage(spread.left, `left-${i}`)}
        <div class="photo-grid-container">
          <div class="photo-grid-desc" style="text-align:center; padding:10px; font-size:0.9rem; color:var(--brown-medium); font-weight:600;">
            ${spread.right.description}
          </div>
          <div class="photo-grid">
            ${spread.right.photos.map((photo, pi) => renderGridItem(photo, i, pi)).join('')}
          </div>
        </div>
      `;
      container.appendChild(div);
    } else {
      const div = document.createElement('div');
      div.className = `spread ${i === 0 ? 'active' : ''}`;
      div.id = `spread-${i}`;
      div.innerHTML = `
        ${renderPage(spread.left, `left-${i}`)}
        ${renderPage(spread.right, `right-${i}`)}
      `;
      container.appendChild(div);
    }
  });
}

function renderPage(page, id) {
  const isUnlocked = unlocked.has(id);
  return `
    <div class="page ${isUnlocked ? 'unlocked' : 'locked'}" id="page-${id}">
      <div class="placeholder-img" style="--accent1: ${page.accent1}; --accent2: ${page.accent2};"></div>
      <div class="lock-overlay">
        <div class="lock-icon">🔒</div>
        <div class="lock-text">Unlock this memory</div>
        <div class="lock-hint">Answer a question about us</div>
        <button class="unlock-btn" onclick="openTrivia('${id}')">Unlock Memory</button>
      </div>
      ${isUnlocked ? `
        <div class="page-info">
          <h3>${page.title}</h3>
          <p>${page.description}</p>
          <span class="page-date">${page.date}</span>
          ${page.tag ? `<span style="background:${page.accent1}22; color:${page.accent1}; padding:3px 10px; border-radius:10px; font-size:0.7rem; margin-left:6px; font-weight:600;">${page.tag}</span>` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

function renderGridItem(photo, spreadIdx, photoIdx) {
  const id = `grid-${spreadIdx}-${photoIdx}`;
  const isUnlocked = unlocked.has(id);
  return `
    <div class="grid-item ${isUnlocked ? 'unlocked' : 'locked'}" id="page-${id}">
      <div class="placeholder-img" style="--accent1:${photo.accent1}; --accent2:${photo.accent2}; aspect-ratio:1;"></div>
      <div class="lock-overlay">
        <div class="lock-icon">🔒</div>
        <button class="unlock-btn" onclick="openGridTrivia('${id}', ${spreadIdx}, ${photoIdx})">Unlock</button>
      </div>
      ${isUnlocked ? `<div class="page-info" style="padding:10px;"><p style="font-size:0.85rem; color:#666;">Memory unlocked!</p></div>` : ''}
    </div>
  `;
}

function openGridTrivia(id, spreadIdx, photoIdx) {
  const photo = spreads[spreadIdx].photos[photoIdx];
  currentTriviaId = id;
  document.getElementById('triviaTitle').textContent = '🔒 Memory Lock';
  document.getElementById('triviaQuestion').textContent = photo.trivia.question;
  const optsDiv = document.getElementById('triviaOptions');
  optsDiv.innerHTML = '';
  photo.trivia.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'trivia-option';
    btn.textContent = opt;
    btn.onclick = () => {
      const allBtns = optsDiv.querySelectorAll('.trivia-option');
      allBtns.forEach(b => b.onclick = null);
      const imgDiv = document.getElementById('triviaImage');
      imgDiv.style.display = 'block';
      if (i === photo.trivia.correct) {
        btn.classList.add('correct');
        document.getElementById('triviaResult').textContent = '🎉 Perfect! Memory unlocked!';
        document.getElementById('triviaResult').className = 'trivia-result success';
        document.getElementById('triviaClose').style.display = 'inline-block';
        document.getElementById('triviaTryAgain').style.display = 'none';
        unlocked.add(id);
        localStorage.setItem('start-unlocked', JSON.stringify([...unlocked]));
        const pageEl = document.getElementById(`page-${id}`);
        if (pageEl) {
          pageEl.classList.remove('locked');
          pageEl.classList.add('unlocked');
          const info = pageEl.querySelector('.page-info');
          if (info) info.innerHTML = '<p style="font-size:0.85rem; color:#666;">Memory unlocked!</p>';
        }
        updateProgress();
        fireConfetti();
        imgDiv.innerHTML = '<div style="font-size:4rem;">🎉</div>';
      } else {
        btn.classList.add('wrong');
        document.getElementById('triviaResult').textContent = 'Try again 😢';
        document.getElementById('triviaResult').className = 'trivia-result fail';
        document.getElementById('triviaClose').style.display = 'none';
        document.getElementById('triviaTryAgain').style.display = 'inline-block';
        imgDiv.innerHTML = '<div style="font-size:4rem;">😢</div>';
      }
    };
    optsDiv.appendChild(btn);
  });
  document.getElementById('triviaResult').textContent = '';
  document.getElementById('triviaResult').className = 'trivia-result';
  document.getElementById('triviaImage').style.display = 'none';
  document.getElementById('triviaClose').style.display = 'none';
  document.getElementById('triviaTryAgain').style.display = 'none';
  document.getElementById('triviaBackdrop').classList.add('show');
}

function renderDots() {
  const dots = document.getElementById('pageDots');
  dots.innerHTML = '';
  spreads.forEach((spread, i) => {
    const dot = document.createElement('div');
    dot.className = `page-dot ${i === 0 ? 'active' : ''} ${spreadFullyUnlocked(i) ? 'fully-unlocked' : ''}`;
    dot.textContent = spread.month.substring(0, 3).toUpperCase();
    dot.title = spread.month;
    dot.onclick = () => goToPage(i);
    dots.appendChild(dot);
  });
}

function spreadFullyUnlocked(i) {
  return unlocked.has(`left-${i}`) && unlocked.has(`right-${i}`);
}

function navigate(dir) {
  const next = currentPage + dir;
  if (next >= 0 && next < spreads.length) {
    document.getElementById(`spread-${currentPage}`).classList.remove('active');
    currentPage = next;
    document.getElementById(`spread-${currentPage}`).classList.add('active');
    updateDots();
    updateNav();
    localStorage.setItem('start-currentPage', currentPage);
  }
}

function goToPage(i) {
  document.getElementById(`spread-${currentPage}`).classList.remove('active');
  currentPage = i;
  document.getElementById(`spread-${currentPage}`).classList.add('active');
  updateDots();
  updateNav();
  localStorage.setItem('start-currentPage', currentPage);
}

function updateDots() {
  document.querySelectorAll('.page-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentPage);
    dot.classList.toggle('fully-unlocked', spreadFullyUnlocked(i));
  });
}

function updateNav() {
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === spreads.length - 1;
}

function updateProgress() {
  const total = spreads.length * 2;
  const done = unlocked.size;
  const pct = total > 0 ? (done / total) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `Unlocked ${done} of ${total} memories`;
}

let currentTriviaId = null;

function openTrivia(id) {
  currentTriviaId = id;
  let page = null;
  
  if (id.startsWith('card-')) {
    const parts = id.split('-');
    const spreadIdx = parseInt(parts[1]);
    const cardIdx = parseInt(parts[2]);
    if (spreads[spreadIdx] && spreads[spreadIdx].cards && spreads[spreadIdx].cards[cardIdx]) {
      page = spreads[spreadIdx].cards[cardIdx];
    }
  } else if (id.startsWith('left-') || id.startsWith('right-')) {
    const spreadIdx = parseInt(id.split('-')[1]);
    const side = id.split('-')[0];
    if (spreads[spreadIdx]) {
      page = spreads[spreadIdx][side === 'left' ? 'left' : 'right'];
    }
  }
  
  if (!page || !page.trivia) return;

  document.getElementById('triviaTitle').textContent = `🔒 ${page.title}`;
  document.getElementById('triviaQuestion').textContent = page.trivia.question;

  const optsDiv = document.getElementById('triviaOptions');
  optsDiv.innerHTML = '';

  page.trivia.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'trivia-option';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, i, page.trivia.correct, id);
    optsDiv.appendChild(btn);
  });

  document.getElementById('triviaResult').textContent = '';
  document.getElementById('triviaResult').className = 'trivia-result';
  document.getElementById('triviaImage').style.display = 'none';
  document.getElementById('triviaClose').style.display = 'none';
  document.getElementById('triviaTryAgain').style.display = 'none';
  document.getElementById('triviaBackdrop').classList.add('show');
}

function tryAgain() {
  document.getElementById('triviaTryAgain').style.display = 'none';
  document.getElementById('triviaBackdrop').classList.remove('show');
  if (currentTriviaId && currentTriviaId.startsWith('grid-')) {
    const parts = currentTriviaId.split('-');
    const spreadIdx = parseInt(parts[1]);
    const photoIdx = parseInt(parts[2]);
    openGridTrivia(currentTriviaId, spreadIdx, photoIdx);
  } else {
    openTrivia(currentTriviaId);
  }
}

function checkAnswer(btn, selected, correct, id) {
  const optsDiv = document.getElementById('triviaOptions');
  const allBtns = optsDiv.querySelectorAll('.trivia-option');
  allBtns.forEach(b => b.onclick = null);

  const imgDiv = document.getElementById('triviaImage');
  imgDiv.style.display = 'block';

  if (selected === correct) {
    btn.classList.add('correct');
    document.getElementById('triviaResult').textContent = '🎉 Perfect! Memory unlocked!';
    document.getElementById('triviaResult').className = 'trivia-result success';
    document.getElementById('triviaClose').style.display = 'inline-block';
    document.getElementById('triviaTryAgain').style.display = 'none';
    unlockPage(id);
    fireConfetti();
    imgDiv.innerHTML = `<div style="font-size:4rem;">🎉</div><div style="font-size:0.85rem; color:var(--brown-medium); margin-top:4px;">Celebration picture coming soon!</div>`;
  } else {
    btn.classList.add('wrong');
    document.getElementById('triviaResult').textContent = 'Try again 😢';
    document.getElementById('triviaResult').className = 'trivia-result fail';
    document.getElementById('triviaClose').style.display = 'none';
    document.getElementById('triviaTryAgain').style.display = 'inline-block';
    imgDiv.innerHTML = `<div style="font-size:4rem;">😢</div><div style="font-size:0.85rem; color:var(--brown-medium); margin-top:4px;">Sad picture coming soon!</div>`;
  }
}

function unlockPage(id) {
  unlocked.add(id);
  localStorage.setItem('start-unlocked', JSON.stringify([...unlocked]));
  const pageEl = document.getElementById(`page-${id}`);
  if (pageEl) {
    pageEl.classList.remove('locked');
    pageEl.classList.add('unlocked');
    let page = null;
    if (id.startsWith('card-')) {
      const parts = id.split('-');
      const spreadIdx = parseInt(parts[1]);
      const cardIdx = parseInt(parts[2]);
      if (spreads[spreadIdx] && spreads[spreadIdx].cards && spreads[spreadIdx].cards[cardIdx]) {
        page = spreads[spreadIdx].cards[cardIdx];
      }
    } else if (id.startsWith('left-') || id.startsWith('right-')) {
      const spreadIdx = parseInt(id.split('-')[1]);
      const side = id.split('-')[0];
      if (spreads[spreadIdx]) {
        page = spreads[spreadIdx][side === 'left' ? 'left' : 'right'];
      }
    }
    if (page) {
      const infoDiv = document.createElement('div');
      infoDiv.className = 'page-info';
      infoDiv.innerHTML = `
        <h3>${page.title}</h3>
        <p>${page.description}</p>
        <span class="page-date">${page.date}</span>
        ${page.tag ? `<span style="background:${page.accent1}22; color:${page.accent1}; padding:3px 10px; border-radius:10px; font-size:0.7rem; margin-left:6px; font-weight:600;">${page.tag}</span>` : ''}
      `;
      pageEl.appendChild(infoDiv);
    }
  }
  updateProgress();
  updateDots();
}

function closeTrivia() {
  document.getElementById('triviaBackdrop').classList.remove('show');
}

function clearAllProgress() {
  if (confirm('Reset all progress? This will lock every page.')) {
    unlocked.clear();
    localStorage.removeItem('start-unlocked');
    localStorage.removeItem('start-currentPage');
    currentPage = 0;
    init();
  }
}

function fireConfetti() {
  const colors = ['#C4944A', '#D4A853', '#C97B63', '#8B7355', '#6B4E37'];
  for (let i = 0; i < 45; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    c.style.width = (Math.random() * 10 + 6) + 'px';
    c.style.height = (Math.random() * 10 + 6) + 'px';
    c.style.animation = `confettiFall ${Math.random() * 2 + 1.5}s linear forwards`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

const style = document.createElement('style');
style.textContent = `
  @keyframes confettiFall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
`;
document.head.appendChild(style);

init();
</script>
</body>
</html>
