<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Start 🌅</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@500;700&display=swap');

:root {
  --brown-dark: #2C1810;
  --brown: #4A3728;
  --brown-medium: #6B4E37;
  --brown-light: #8B7355;
  --caramel: #C4944A;
  --golden: #D4A853;
  --terracotta: #C97B63;
  --sage: #7BA69C;
  --cream: #FFF8F0;
  --beige: #F5EDE0;
  --beige-dark: #E8DCC8;
  --sand: #D4B896;
  --white: #FEFCF8;
  --ink: #2C1810;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(180deg, var(--beige) 0%, var(--cream) 50%, var(--sand) 100%);
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--ink);
}

/* Subtle background pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 30%, rgba(196,148,74,0.1) 0%, transparent 50%),
              radial-gradient(circle at 80% 70%, rgba(201,123,99,0.08) 0%, transparent 50%);
  z-index: 0;
  pointer-events: none;
}

/* Sun decoration */
body::after {
  content: '';
  position: fixed;
  top: -60px;
  right: -60px;
  width: 220px;
  height: 220px;
  background: radial-gradient(circle, var(--golden) 0%, var(--caramel) 40%, transparent 70%);
  border-radius: 50%;
  opacity: 0.45;
  z-index: 0;
  animation: sunPulse 4s ease-in-out infinite;
}

@keyframes sunPulse {
  0%, 100% { transform: scale(1); opacity: 0.45; }
  50% { transform: scale(1.08); opacity: 0.65; }
}

/* Floating particles */
.particle {
  position: fixed;
  width: 4px;
  height: 4px;
  background: var(--caramel);
  border-radius: 50%;
  opacity: 0;
  z-index: 1;
  animation: particleFloat 9s ease-in-out infinite;
  pointer-events: none;
}

@keyframes particleFloat {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.4; }
  90% { opacity: 0.4; }
  100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}

/* Header */
header {
  text-align: center;
  padding: 50px 20px 25px;
  position: relative;
  z-index: 10;
}

header h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(2.5rem, 5vw, 4rem);
  color: var(--brown);
  text-shadow: 3px 3px 0 var(--caramel), -1px -1px 0 rgba(0,0,0,0.05);
  animation: titleBounce 0.7s ease;
}

@keyframes titleBounce {
  0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
  60% { transform: scale(1.08) rotate(2deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

header .subtitle {
  font-size: clamp(0.9rem, 2vw, 1.15rem);
  color: var(--brown-medium);
  font-weight: 600;
  margin-top: 8px;
  opacity: 0;
  animation: fadeInUp 0.5s ease 0.3s forwards;
}

header .dates {
  display: inline-block;
  padding: 5px 16px;
  background: var(--beige-dark);
  border-radius: 18px;
  color: var(--brown);
  font-size: 0.85rem;
  font-weight: 600;
  margin-top: 10px;
  opacity: 0;
  animation: fadeInUp 0.5s ease 0.5s forwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Page dots */
.page-dots {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 20px 0;
  position: relative;
  z-index: 10;
  flex-wrap: wrap;
}

.page-dot {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid var(--caramel);
  background: var(--white);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--brown);
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-dot.active {
  background: var(--caramel);
  color: white;
  transform: scale(1.2);
}

.page-dot.fully-unlocked {
  background: var(--sage);
  border-color: var(--sage);
  color: white;
}

/* Book container */
.book-container {
  max-width: 1000px;
  margin: 20px auto;
  padding: 0 20px;
  position: relative;
  z-index: 10;
}

/* Spread layout */
.spread {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  animation: spreadIn 0.5s ease;
}

.spread.active {
  display: grid;
}

@keyframes spreadIn {
  from { opacity: 0; transform: rotateY(-15deg); }
  to { opacity: 1; transform: rotateY(0); }
}

@media (max-width: 700px) {
  .spread.active { grid-template-columns: 1fr; }
}

/* Page */
.page {
  background: var(--white);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(44,24,16,0.08);
  position: relative;
  transition: transform 0.3s ease, border-color 0.3s ease;
  border: 4px solid transparent;
}

.page:hover {
  transform: translateY(-5px) rotate(-1deg);
  border-color: var(--caramel);
}

/* Lock overlay */
.lock-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(74,55,40,0.95), rgba(107,78,55,0.92), rgba(139,115,85,0.92));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  border-radius: 14px;
  padding: 20px;
}

.page.locked .lock-overlay {
  opacity: 1;
  pointer-events: all;
}

.lock-icon {
  font-size: 64px;
  animation: lockShake 2s ease-in-out infinite;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
}

@keyframes lockShake {
  0%, 100% { transform: rotate(0) scale(1); }
  25% { transform: rotate(-5deg) scale(1.05); }
  75% { transform: rotate(5deg) scale(1.05); }
}

.lock-text {
  color: var(--cream);
  font-weight: 700;
  font-size: 1.15rem;
  margin-top: 10px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}

.lock-hint {
  color: rgba(255,248,240,0.8);
  font-size: 0.8rem;
  margin-top: 5px;
}

.unlock-btn {
  margin-top: 18px;
  padding: 12px 28px;
  background: var(--caramel);
  border: none;
  border-radius: 28px;
  font-family: 'Fredoka', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: white;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.unlock-btn:hover {
  transform: scale(1.06);
  background: var(--golden);
}

/* Trivia modal */
.trivia-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(44,24,16,0.7);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.trivia-backdrop.show {
  display: flex;
}

.trivia-card {
  background: var(--white);
  border-radius: 26px;
  padding: 36px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 25px 70px rgba(44,24,16,0.35);
  animation: triviaPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

@keyframes triviaPop {
  from { transform: scale(0.65) rotate(-6deg); opacity: 0; }
  to { transform: scale(1) rotate(0); opacity: 1; }
}

.trivia-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 7px;
  background: linear-gradient(90deg, var(--caramel), var(--terracotta), var(--golden));
}

.trivia-card h3 {
  font-family: 'Caveat', cursive;
  font-size: 2rem;
  color: var(--brown);
  margin-bottom: 14px;
}

.trivia-card .question {
  font-size: 1.05rem;
  line-height: 1.5;
  margin-bottom: 22px;
  color: var(--ink);
}

.trivia-options {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.trivia-option {
  padding: 13px 18px;
  border: 3px solid var(--beige-dark);
  border-radius: 13px;
  background: var(--cream);
  font-family: 'Fredoka', sans-serif;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  color: var(--ink);
}

.trivia-option:hover {
  border-color: var(--caramel);
  background: white;
  transform: translateX(5px);
}

.trivia-option.correct {
  background: #d4edda;
  border-color: #28a745;
  color: #155724;
  transform: scale(1.02);
}

.trivia-option.wrong {
  background: #f8d7da;
  border-color: #dc3545;
  color: #721c24;
}

.trivia-result {
  margin-top: 18px;
  text-align: center;
  font-weight: 700;
  font-size: 1.05rem;
  min-height: 30px;
}

.trivia-result.success { color: #28a745; }
.trivia-result.fail { color: #dc3545; }

.trivia-close {
  margin-top: 18px;
  padding: 12px 28px;
  background: var(--brown);
  border: none;
  border-radius: 28px;
  color: var(--cream);
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
}

.trivia-close:hover { background: var(--brown-medium); transform: scale(1.05); }

/* Page info */
.page-info {
  padding: 18px;
}

.page-info h3 {
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  color: var(--brown);
}

.page-info p {
  font-size: 0.9rem;
  color: #666;
  margin-top: 5px;
  line-height: 1.45;
}

.page-date {
  display: inline-block;
  padding: 4px 11px;
  background: var(--beige-dark);
  border-radius: 13px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--brown);
  margin-top: 7px;
}

/* Navigation */
.nav-controls {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin: 35px 0;
  position: relative;
  z-index: 10;
}

.nav-btn {
  padding: 13px 30px;
  border: none;
  border-radius: 32px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.nav-btn:not(:disabled):hover {
  transform: translateY(-3px);
  box-shadow: 0 7px 22px rgba(44,24,16,0.15);
}

.nav-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.nav-btn.prev { background: var(--white); color: var(--brown); border: 3px solid var(--caramel); }
.nav-btn.next { background: var(--brown); color: var(--cream); }
.nav-btn.next:hover:not(:disabled) { background: var(--brown-medium); }

/* Progress bar */
.progress-section {
  max-width: 1000px;
  margin: 18px auto 0;
  padding: 0 20px;
  position: relative;
  z-index: 10;
}

.progress-bar {
  height: 9px;
  background: var(--beige-dark);
  border-radius: 5px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--caramel), var(--golden), var(--terracotta));
  border-radius: 5px;
  transition: width 0.5s ease;
  width: 0%;
}

.progress-text {
  text-align: center;
  font-size: 0.88rem;
  color: var(--brown-medium);
  font-weight: 600;
  margin-top: 9px;
}

/* Back link */
.back-link {
  display: inline-block;
  margin: 20px auto;
  padding: 8px 20px;
  background: var(--beige-dark);
  color: var(--brown);
  text-decoration: none;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.2s;
}

.back-link:hover {
  background: var(--caramel);
  color: white;
}

/* Footer */
footer {
  text-align: center;
  padding: 35px 20px 55px;
  position: relative;
  z-index: 10;
}

footer p {
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: var(--brown);
}

footer .heart {
  display: inline-block;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.25); }
  30% { transform: scale(1); }
  45% { transform: scale(1.15); }
}

/* Placeholder image */
.placeholder-img {
  width: 100%;
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4.5rem;
  position: relative;
  overflow: hidden;
}

.placeholder-img::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent1, #6B4E37), var(--accent2, #C4944A));
  opacity: 0.12;
}

.placeholder-img span {
  position: relative;
  z-index: 1;
}

/* Confetti burst */
.confetti {
  position: fixed;
  z-index: 200;
  pointer-events: none;
}

@media (max-width: 480px) {
  .trivia-card { padding: 24px; }
  .page-dots { gap: 8px; }
  .page-dot { width: 34px; height: 34px; font-size: 0.72rem; }
}
</style>
</head>
<body>

<div class="particle" style="left: 15%; animation-delay: 0s;"></div>
<div class="particle" style="left: 35%; animation-delay: 3s;"></div>
<div class="particle" style="left: 55%; animation-delay: 1s;"></div>
<div class="particle" style="left: 75%; animation-delay: 5s;"></div>
<div class="particle" style="left: 90%; animation-delay: 2s;"></div>

<header>
  <h1>The Start 🌅</h1>
  <p class="subtitle">August 2025 — Where it all started</p>
</header>

<div class="page-dots" id="pageDots"></div>

<div class="book-container" id="bookContainer"></div>

<div class="nav-controls">
  <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)">◀ Prev</button>
  <button class="nav-btn next" id="nextBtn" onclick="navigate(1)">Next ▶</button>
</div>

<div class="progress-section">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <p class="progress-text" id="progressText">Unlock 0 of 0 memories ✨</p>
</div>

<div style="text-align: center;">
  <a href="../" class="back-link">← Back to Home</a>
</div>

<div class="trivia-backdrop" id="triviaBackdrop">
  <div class="trivia-card">
    <h3 id="triviaTitle">🔒 Memory Lock</h3>
    <p class="question" id="triviaQuestion"></p>
    <div class="trivia-options" id="triviaOptions"></div>
    <div class="trivia-result" id="triviaResult"></div>
    <button class="trivia-close" id="triviaClose" style="display:none;" onclick="closeTrivia()">Continue ✨</button>
  </div>
</div>

<footer>
  <p>Made with <span class="heart">🤎</span> — Where it all began</p>
</footer>

<script>
const spreads = [
  {
    left: {
      title: "Tennessee Days 🎸",
      description: "Nashville, Memphis, the Smokies — Tennessee was where it started. Music, vibes, and the slow realization that I was falling hard.",
      emoji: "🎸",
      accent1: "#6B4E37",
      accent2: "#C97B63",
      date: "Early August",
      tag: "Tennessee",
      trivia: {
        question: "What Tennessee city did we explore first?",
        options: ["Nashville 🎸", "Memphis 🎵", "Gatlinburg 🏔️", "Chattanooga 🌉"],
        correct: 0
      }
    },
    right: {
      title: "Falling for You 🍂",
      description: "It wasn't one moment — it was a thousand little ones. Every conversation, every laugh. Tennessee made it impossible not to.",
      emoji: "🍂",
      accent1: "#C4944A",
      accent2: "#8B7355",
      date: "Early August",
      tag: "Falling",
      trivia: {
        question: "When did I realize I was falling for you?",
        options: ["First conversation 💬", "When I saw your smile 😊", "Somewhere over Tennessee 🗺️", "All of the above 💝"],
        correct: 3
      }
    }
  },
  {
    left: {
      title: "August 16: FaceTime Sleepover 🌙",
      description: "First time sleeping on FaceTime together. Didn't want to hang up. Fell asleep to each other's breathing. Long distance never felt so close.",
      emoji: "📱",
      accent1: "#4A3728",
      accent2: "#6B4E37",
      date: "August 16, 2025",
      tag: "First",
      trivia: {
        question: "How long did our first FaceTime sleepover last?",
        options: ["2 hours", "4 hours", "All night long 🌅", "We're still on it 📱"],
        correct: 2
      }
    },
    right: {
      title: "August 25: First Kiss 💋",
      description: "First kiss — on FaceTime, because that's what we had. But it counted. It absolutely counted. Long distance couldn't stop this one.",
      emoji: "💋",
      accent1: "#C97B63",
      accent2: "#C4944A",
      date: "August 25, 2025",
      tag: "Milestone",
      trivia: {
        question: "How did we kiss for the first time?",
        options: ["On FaceTime 📱", "In person 💏", "Through a letter 💌", "In a dream 😴"],
        correct: 0
      }
    }
  }
];

let currentPage = 0;
const unlocked = new Set();

function init() {
  renderBook();
  renderDots();
  updateProgress();
  updateNav();
}

function renderBook() {
  const container = document.getElementById('bookContainer');
  container.innerHTML = '';
  spreads.forEach((spread, i) => {
    const div = document.createElement('div');
    div.className = `spread ${i === 0 ? 'active' : ''}`;
    div.id = `spread-${i}`;
    div.innerHTML = `
      ${renderPage(spread.left, `left-${i}`)}
      ${renderPage(spread.right, `right-${i}`)}
    `;
    container.appendChild(div);
  });
}

function renderPage(page, id) {
  const isUnlocked = unlocked.has(id);
  return `
    <div class="page ${isUnlocked ? 'unlocked' : 'locked'}" id="page-${id}">
      <div class="placeholder-img" style="--accent1: ${page.accent1}; --accent2: ${page.accent2};">
        <span>${page.emoji}</span>
      </div>
      <div class="lock-overlay" id="lock-${id}">
        <div class="lock-icon">🔒</div>
        <div class="lock-text">Unlock this memory</div>
        <div class="lock-hint">Answer a question about us ✨</div>
        <button class="unlock-btn" onclick="openTrivia('${id}')">Unlock Memory</button>
      </div>
      ${isUnlocked ? `
        <div class="page-info">
          <h3>${page.title}</h3>
          <p>${page.description}</p>
          <span class="page-date">${page.date}</span>
          ${page.tag ? `<span style="background:${page.accent1}22; color:${page.accent1}; padding:3px 10px; border-radius:10px; font-size:0.7rem; margin-left:6px; font-weight:600;">${page.tag}</span>` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

function renderDots() {
  const dots = document.getElementById('pageDots');
  dots.innerHTML = '';
  spreads.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = `page-dot ${i === 0 ? 'active' : ''} ${spreadFullyUnlocked(i) ? 'fully-unlocked' : ''}`;
    dot.textContent = i + 1;
    dot.onclick = () => goToPage(i);
    dots.appendChild(dot);
  });
}

function spreadFullyUnlocked(i) {
  return unlocked.has(`left-${i}`) && unlocked.has(`right-${i}`);
}

function navigate(dir) {
  const next = currentPage + dir;
  if (next >= 0 && next < spreads.length) {
    document.getElementById(`spread-${currentPage}`).classList.remove('active');
    currentPage = next;
    document.getElementById(`spread-${currentPage}`).classList.add('active');
    updateDots();
    updateNav();
  }
}

function goToPage(i) {
  document.getElementById(`spread-${currentPage}`).classList.remove('active');
  currentPage = i;
  document.getElementById(`spread-${currentPage}`).classList.add('active');
  updateDots();
  updateNav();
}

function updateDots() {
  document.querySelectorAll('.page-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentPage);
    dot.classList.toggle('fully-unlocked', spreadFullyUnlocked(i));
  });
}

function updateNav() {
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === spreads.length - 1;
}

function updateProgress() {
  const total = spreads.length * 2;
  const done = unlocked.size;
  const pct = total > 0 ? (done / total) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `Unlocked ${done} of ${total} memories ✨`;
}

let currentTriviaId = null;

function openTrivia(id) {
  currentTriviaId = id;
  const spreadIdx = parseInt(id.split('-')[1]);
  const side = id.split('-')[0];
  const page = spreads[spreadIdx][side === 'left' ? 'left' : 'right'];

  document.getElementById('triviaTitle').textContent = `🔒 ${page.title}`;
  document.getElementById('triviaQuestion').textContent = page.trivia.question;

  const optsDiv = document.getElementById('triviaOptions');
  optsDiv.innerHTML = '';

  page.trivia.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'trivia-option';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, i, page.trivia.correct);
    optsDiv.appendChild(btn);
  });

  document.getElementById('triviaResult').textContent = '';
  document.getElementById('triviaResult').className = 'trivia-result';
  document.getElementById('triviaClose').style.display = 'none';
  document.getElementById('triviaBackdrop').classList.add('show');
}

function checkAnswer(btn, selected, correct) {
  const optsDiv = document.getElementById('triviaOptions');
  const allBtns = optsDiv.querySelectorAll('.trivia-option');
  allBtns.forEach(b => b.onclick = null);

  if (selected === correct) {
    btn.classList.add('correct');
    document.getElementById('triviaResult').textContent = '🎉 Perfect! Memory unlocked!';
    document.getElementById('triviaResult').className = 'trivia-result success';
    document.getElementById('triviaClose').style.display = 'inline-block';
    unlockPage(currentTriviaId);
    fireConfetti();
  } else {
    btn.classList.add('wrong');
    allBtns[correct].classList.add('correct');
    document.getElementById('triviaResult').textContent = 'Close enough — unlocked because I love you 😘💕';
    document.getElementById('triviaResult').className = 'trivia-result fail';
    document.getElementById('triviaClose').style.display = 'inline-block';
    unlockPage(currentTriviaId);
  }
}

function unlockPage(id) {
  unlocked.add(id);
  const pageEl = document.getElementById(`page-${id}`);
  if (pageEl) {
    pageEl.classList.remove('locked');
    pageEl.classList.add('unlocked');
    const spreadIdx = parseInt(id.split('-')[1]);
    const side = id.split('-')[0];
    const page = spreads[spreadIdx][side === 'left' ? 'left' : 'right'];
    const infoDiv = document.createElement('div');
    infoDiv.className = 'page-info';
    infoDiv.innerHTML = `
      <h3>${page.title}</h3>
      <p>${page.description}</p>
      <span class="page-date">${page.date}</span>
      ${page.tag ? `<span style="background:${page.accent1}22; color:${page.accent1}; padding:3px 10px; border-radius:10px; font-size:0.7rem; margin-left:6px; font-weight:600;">${page.tag}</span>` : ''}
    `;
    pageEl.appendChild(infoDiv);
  }
  updateProgress();
  updateDots();
}

function closeTrivia() {
  document.getElementById('triviaBackdrop').classList.remove('show');
}

function fireConfetti() {
  const colors = ['#C4944A', '#D4A853', '#C97B63', '#8B7355', '#6B4E37'];
  for (let i = 0; i < 45; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    c.style.width = (Math.random() * 10 + 6) + 'px';
    c.style.height = (Math.random() * 10 + 6) + 'px';
    c.style.animation = `confettiFall ${Math.random() * 2 + 1.5}s linear forwards`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

const style = document.createElement('style');
style.textContent = `
  @keyframes confettiFall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
`;
document.head.appendChild(style);

init();
</script>
</body>
</html>
