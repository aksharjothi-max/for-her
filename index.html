<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Her 🤎</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@500;700&display=swap');

:root {
  --brown-dark: #2C1810;
  --brown: #4A3728;
  --brown-medium: #6B4E37;
  --brown-light: #8B7355;
  --caramel: #C4944A;
  --golden: #D4A853;
  --terracotta: #C97B63;
  --sage: #7BA69C;
  --cream: #FFF8F0;
  --beige: #F5EDE0;
  --beige-dark: #E8DCC8;
  --sand: #D4B896;
  --white: #FEFCF8;
  --ink: #2C1810;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(135deg, var(--beige) 0%, var(--cream) 40%, var(--sand) 100%);
  min-height: 100vh;
  color: var(--ink);
  overflow-x: hidden;
}

/* Subtle background pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 30%, rgba(196,148,74,0.1) 0%, transparent 50%),
              radial-gradient(circle at 80% 70%, rgba(201,123,99,0.08) 0%, transparent 50%);
  z-index: 0;
  pointer-events: none;
}

/* Floating particles */
.particle {
  position: fixed;
  width: 5px;
  height: 5px;
  background: var(--caramel);
  border-radius: 50%;
  opacity: 0;
  z-index: 1;
  animation: particleFloat 10s ease-in-out infinite;
  pointer-events: none;
}

@keyframes particleFloat {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.35; }
  90% { opacity: 0.35; }
  100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}

/* Header */
header {
  text-align: center;
  padding: 80px 20px 40px;
  position: relative;
  z-index: 10;
}

header h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(3rem, 7vw, 5rem);
  color: var(--brown);
  text-shadow: 4px 4px 0 var(--caramel), 0 0 40px rgba(196,148,74,0.2);
  animation: titleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes titleIn {
  from { transform: scale(0.3) rotate(-10deg); opacity: 0; }
  to { transform: scale(1) rotate(0); opacity: 1; }
}

header p {
  font-size: clamp(1rem, 2.5vw, 1.25rem);
  color: var(--brown-medium);
  margin-top: 16px;
  opacity: 0;
  animation: fadeInUp 0.6s ease 0.4s forwards;
}

.heart-line {
  display: inline-block;
  margin-top: 12px;
  font-size: 1.5rem;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.3); }
  30% { transform: scale(1); }
  45% { transform: scale(1.2); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Sections grid */
.sections {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 30px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 30px;
  position: relative;
  z-index: 10;
}

/* Section card */
.section-card {
  background: var(--white);
  border: 2px solid var(--beige-dark);
  border-radius: 24px;
  padding: 40px 30px;
  text-align: center;
  cursor: pointer;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: block;
}

.section-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--card-accent, var(--caramel)), transparent);
  opacity: 0;
  transition: opacity 0.4s ease;
}

.section-card:hover::before {
  opacity: 0.06;
}

.section-card:hover {
  transform: translateY(-8px);
  border-color: var(--card-accent, var(--caramel));
  box-shadow: 0 20px 60px rgba(44,24,16,0.12), 0 0 40px var(--card-glow, rgba(196,148,74,0.15));
}

.section-card.locked {
  opacity: 0.55;
  cursor: not-allowed;
}

.section-card.locked:hover {
  transform: none;
  box-shadow: none;
  border-color: var(--beige-dark);
}

.card-emoji {
  font-size: 4rem;
  margin-bottom: 16px;
  display: block;
  animation: cardFloat 3s ease-in-out infinite;
}

.section-card:nth-child(2) .card-emoji { animation-delay: 0.5s; }
.section-card:nth-child(3) .card-emoji { animation-delay: 1s; }
.section-card:nth-child(4) .card-emoji { animation-delay: 1.5s; }

@keyframes cardFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.card-title {
  font-family: 'Caveat', cursive;
  font-size: 2rem;
  margin-bottom: 8px;
  color: var(--card-accent, var(--brown));
  position: relative;
  z-index: 1;
}

.card-desc {
  font-size: 0.95rem;
  color: var(--brown-medium);
  line-height: 1.5;
  position: relative;
  z-index: 1;
}

.card-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 0.75rem;
  font-weight: 600;
  margin-top: 12px;
  position: relative;
  z-index: 1;
}

.card-badge.live {
  background: rgba(123,166,156,0.2);
  color: var(--sage);
  border: 1px solid var(--sage);
}

.card-badge.coming {
  background: rgba(196,148,74,0.2);
  color: var(--brown-medium);
  border: 1px solid var(--caramel);
}

.card-badge.locked-badge {
  background: var(--beige-dark);
  color: var(--brown-light);
  border: 1px solid var(--sand);
}

/* Section wrapper */
.section-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Section description above card */
.section-desc {
  font-size: 0.95rem;
  color: var(--brown-medium);
  margin-bottom: 12px;
  text-align: center;
  max-width: 400px;
  line-height: 1.5;
}

/* Footer */
footer {
  text-align: center;
  padding: 40px 20px 60px;
  position: relative;
  z-index: 10;
}

footer p {
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: var(--brown);
}

footer .sub {
  font-size: 0.85rem;
  color: var(--brown-light);
  margin-top: 6px;
}

/* Wave */
.wave {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60px;
  z-index: 1;
  overflow: hidden;
}

.wave svg {
  position: absolute;
  bottom: 0;
  width: 200%;
  height: 100%;
  animation: waveMove 8s linear infinite;
}

@keyframes waveMove {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* Responsive */
@media (max-width: 768px) {
  header { padding: 50px 15px 30px; }
  .sections { padding: 20px 15px; gap: 20px; }
  .section-card { padding: 30px 20px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="particle" style="left: 10%; animation-delay: 0s;"></div>
<div class="particle" style="left: 30%; animation-delay: 2s;"></div>
<div class="particle" style="left: 50%; animation-delay: 4s;"></div>
<div class="particle" style="left: 70%; animation-delay: 1s;"></div>
<div class="particle" style="left: 90%; animation-delay: 3s;"></div>

<header>
  <h1>For Her 🤎</h1>
  <p>A collection of everything I've built for her — one memory at a time</p>
  <div class="heart-line">🤎 ✨ 💕</div>
</header>

<main class="sections" id="sections">
  <!-- Populated by JS -->
</main>

<footer>
  <p>Made with <span class="heart-line" style="display:inline-block; animation:heartbeat 1.5s infinite">🤎</span></p>
  <p class="sub">More coming soon...</p>
</footer>

<div class="wave">
  <svg viewBox="0 0 1200 60" preserveAspectRatio="none">
    <path d="M0,30 C150,50 350,10 500,30 C650,50 850,10 1000,30 C1150,50 1200,30 1200,30 L1200,60 L0,60 Z" fill="rgba(212,184,150,0.35)"/>
    <path d="M0,40 C150,20 350,50 500,40 C650,20 850,50 1000,40 C1150,20 1200,40 1200,40 L1200,60 L0,60 Z" fill="rgba(212,184,150,0.18)"/>
  </svg>
</div>

<script>
const sections = [
  {
    title: "The Start",
    emoji: "🌅",
    desc: "August 2025 — Tennessee, FaceTime sleepovers, and our first kiss. Where it all began.",
    href: "./start/",
    badge: "LIVE",
    accent: "#C97B63",
    glow: "rgba(201,123,99,0.2)",
    locked: false
  },
  {
    title: "Our Anniversary",
    emoji: "💝",
    desc: "Dec 29, 2025 → Dec 29, 2026 — a whole year together. Every single month, one memory at a time.",
    href: "#",
    badge: "COMING SOON",
    accent: "#C4944A",
    glow: "rgba(196,148,74,0.2)",
    locked: true
  },
  {
    title: "Summer 2025",
    emoji: "☀️",
    desc: "Columbus, Cedar Point, water lanterns, Crew games — our whole story.",
    href: "#",
    badge: "COMING SOON",
    accent: "#7BA69C",
    glow: "rgba(123,166,156,0.2)",
    locked: true
  }
];

const container = document.getElementById('sections');

sections.forEach((s, i) => {
  const card = document.createElement('a');
  card.className = `section-card ${s.locked ? 'locked' : ''}`;
  card.href = s.href;
  card.style.setProperty('--card-accent', s.accent);
  card.style.setProperty('--card-glow', s.glow);
  card.style.animation = `fadeInUp 0.5s ease ${0.2 * i}s backwards`;

  if (s.locked) {
    card.onclick = (e) => e.preventDefault();
  }

  // Create section wrapper
  const sectionDiv = document.createElement('div');
  sectionDiv.className = 'section-wrapper';
  sectionDiv.style.animation = `fadeInUp 0.5s ease ${0.2 * i}s backwards`;

  // Add description above card
  const descDiv = document.createElement('p');
  descDiv.className = 'section-desc';
  descDiv.textContent = s.desc;
  sectionDiv.appendChild(descDiv);

  // Add card
  card.innerHTML = `
    <span class="card-emoji">${s.emoji}</span>
    <h3 class="card-title">${s.title}</h3>
    <span class="card-badge ${s.locked ? (s.badge === 'COMING SOON' ? 'coming' : 'locked-badge') : 'live'}">${s.badge}</span>
  `;
  sectionDiv.appendChild(card);

  container.appendChild(sectionDiv);
});
</script>

</body>
</html>
