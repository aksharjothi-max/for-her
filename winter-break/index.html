<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Break — Vaish</title>
<style>
:root {
  --brown-dark: #2C1810;
  --brown: #4A3728;
  --brown-medium: #6B4E37;
  --brown-light: #8B7355;
  --caramel: #C4944A;
  --golden: #D4A853;
  --terracotta: #C97B63;
  --sage: #7BA69C;
  --cream: #FFF8F0;
  --beige: #F5EDE0;
  --beige-dark: #E8DCC8;
  --sand: #D4B896;
  --white: #FEFCF8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(135deg, var(--beige) 0%, var(--cream) 40%, var(--sand) 100%);
  min-height: 100vh;
  color: var(--brown);
}

header {
  text-align: center;
  padding: 60px 20px 30px;
}

header h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(2.5rem, 5vw, 4rem);
  color: var(--brown);
  text-shadow: 3px 3px 0 var(--caramel);
}

header p {
  font-size: 1.1rem;
  color: var(--brown-medium);
  margin-top: 8px;
}

.nav {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

.nav a {
  color: var(--brown);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  border: 2px solid transparent;
  transition: all 0.2s;
}

.nav a:hover, ..nav a.active {
  border-color: var(--caramel);
  color: var(--caramel);
}

.collage {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 30px 60px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}

.photo-item {
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(44,24,16,0.08);
  transition: transform 0.3s ease;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.photo-item:hover {
  transform: translateY(-4px) rotate(-1deg);
}

.photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

footer {
  text-align: center;
  padding: 40px 20px 60px;
}

footer p {
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: var(--brown);
}

@media (max-width: 768px) {
  .collage {
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 12px;
  }
}
</style>
</head>
<body>

<header>
  <h1>❄️ Winter Break</h1>
  <p>December 2025 — Our first trip together</p>
  <div class="nav">
    <a href="../">← Back to Home</a>
  </div>
</header>

<main class="collage" id="collage">
  <!-- Photos will be added here -->
</main>

<footer>
  <p>Made with 🤎</p>
</footer>

<script>
// Photo data will be added here
const photos = [
  // Add photos here: { src: "data:image/jpeg;base64,...", description: "...", date: "..." }
];

const collage = document.getElementById('collage');

photos.forEach((photo, i) => {
  const div = document.createElement('div');
  div.className = 'photo-item';
  div.innerHTML = `<img src="${photo.src}" alt="${photo.description || ''}" loading="lazy" />`;
  collage.appendChild(div);
});
</script>

</body>
</html>
