<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Day We Became Official 💕</title>
<style>
:root {
  --brown-dark: #2C1810;
  --brown: #4A3728;
  --brown-medium: #6B4E37;
  --brown-light: #8B7355;
  --caramel: #C4944A;
  --golden: #D4A853;
  --terracotta: #C97B63;
  --sage: #7BA69C;
  --cream: #FFF8F0;
  --beige: #F5EDE0;
  --beige-dark: #E8DCC8;
  --sand: #D4B896;
  --white: #FEFCF8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(135deg, var(--beige) 0%, var(--cream) 40%, var(--sand) 100%);
  min-height: 100vh;
  color: var(--brown);
}

header {
  text-align: center;
  padding: 60px 20px 30px;
}

header h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(2.5rem, 5vw, 4rem);
  color: var(--brown);
  text-shadow: 3px 3px 0 var(--caramel);
}

header p {
  font-size: 1.1rem;
  color: var(--brown-medium);
  margin-top: 8px;
}

.nav {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

.nav a {
  color: var(--brown);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  border: 2px solid transparent;
  transition: all 0.2s;
}

.nav a:hover {
  border-color: var(--caramel);
  color: var(--caramel);
}

.container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 30px;
}

.locked-section {
  background: var(--white);
  border: 3px solid var(--beige-dark);
  border-radius: 24px;
  padding: 40px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(44,24,16,0.08);
  margin-bottom: 40px;
}

.lock-icon {
  font-size: 3rem;
  margin-bottom: 16px;
  animation: lockShake 2s ease-in-out infinite;
}

@keyframes lockShake {
  0%, 100% { transform: rotate(0) scale(1); }
  25% { transform: rotate(-5deg) scale(1.05); }
  75% { transform: rotate(5deg) scale(1.05); }
}

.locked-section h2 {
  font-family: 'Caveat', cursive;
  font-size: 1.8rem;
  color: var(--brown);
  margin-bottom: 8px;
}

.locked-section p {
  font-size: 0.95rem;
  color: var(--brown-medium);
  margin-bottom: 20px;
}

.unlock-btn {
  padding: 12px 28px;
  background: var(--caramel);
  border: none;
  border-radius: 28px;
  font-family: 'Fredoka', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: white;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.unlock-btn:hover {
  transform: scale(1.05);
  background: var(--golden);
}

/* Grid sections */
.grid-section {
  background: var(--white);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 30px;
  box-shadow: 0 4px 20px rgba(44,24,16,0.08);
}

.grid-section h3 {
  font-family: 'Caveat', cursive;
  font-size: 1.6rem;
  color: var(--brown);
  margin-bottom: 16px;
  text-align: center;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

@media (max-width: 768px) {
  .photo-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
  .photo-grid { grid-template-columns: 1fr; }
}

.photo-item {
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(44,24,16,0.08);
  transition: transform 0.3s ease;
  aspect-ratio: 1;
  position: relative;
}

.photo-item:hover {
  transform: translateY(-4px) rotate(-1deg);
}

.photo-item img,
.photo-item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.photo-info {
  padding: 10px;
  text-align: center;
}

.photo-info p {
  font-size: 0.85rem;
  color: #333;
  font-weight: 600;
  margin: 0;
}

.lock-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(74,55,40,0.95), rgba(107,78,55,0.92), rgba(139,115,85,0.92));
  border-radius: 16px;
  z-index: 10;
}

.lock-overlay .lock-icon-sm {
  font-size: 2rem;
  margin-bottom: 8px;
}

.lock-overlay p {
  color: white;
  font-weight: 700;
  font-size: 0.9rem;
  margin: 0;
}

/* Trivia modal */
.trivia-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(44,24,16,0.7);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.trivia-backdrop.show {
  display: flex;
}

.trivia-card {
  background: var(--white);
  border-radius: 26px;
  padding: 40px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 25px 70px rgba(44,24,16,0.35);
  animation: triviaPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

@keyframes triviaPop {
  from { transform: scale(0.65) rotate(-6deg); opacity: 0; }
  to { transform: scale(1) rotate(0); opacity: 1; }
}

.trivia-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 7px;
  background: linear-gradient(90deg, var(--caramel), var(--terracotta), var(--golden));
}

.trivia-card h3 {
  font-family: 'Caveat', cursive;
  font-size: 2rem;
  color: var(--brown);
  margin-bottom: 16px;
}

.trivia-card .question {
  font-size: 1.05rem;
  line-height: 1.5;
  margin-bottom: 24px;
  color: var(--brown-dark);
}

.trivia-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.trivia-option {
  padding: 14px 20px;
  border: 3px solid var(--beige-dark);
  border-radius: 14px;
  background: var(--cream);
  font-family: 'Fredoka', sans-serif;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  color: var(--brown-dark);
}

.trivia-option:hover {
  border-color: var(--caramel);
  background: white;
  transform: translateX(5px);
}

.trivia-option.correct {
  background: #d4edda;
  border-color: #28a745;
  color: #155724;
  transform: scale(1.02);
}

.trivia-option.wrong {
  background: #f8d7da;
  border-color: #dc3545;
  color: #721c24;
}

.trivia-result {
  margin-top: 20px;
  text-align: center;
  font-weight: 700;
  font-size: 1.1rem;
  min-height: 32px;
}

.trivia-result.success { color: #28a745; }
.trivia-result.fail { color: #dc3545; }

.trivia-close {
  margin-top: 20px;
  padding: 14px 32px;
  background: var(--brown);
  border: none;
  border-radius: 28px;
  color: var(--cream);
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.2s;
}

.trivia-close:hover { background: var(--brown-medium); transform: scale(1.05); }

footer {
  text-align: center;
  padding: 40px 20px 60px;
}

footer p {
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: var(--brown);
}
</style>
</head>
<body>

<header>
  <h1>The Day We Became Official 💕</h1>
  <p>December 29, 2025</p>
  <div class="nav">
    <a href="../">← Back to Home</a>
  </div>
</header>

<main class="container">
  <div class="locked-section" id="lockedSection">
    <div class="lock-icon">🔒</div>
    <h2>6 Grids Locked</h2>
    <p>Answer trivia to unlock each grid of memories</p>
    <p id="progressText" style="font-size:0.9rem; color:var(--brown-light);">Unlocked: 0/6 grids</p>
  </div>
  
  <div id="gridsContainer"></div>
</main>

<div class="trivia-backdrop" id="triviaBackdrop">
  <div class="trivia-card">
    <h3 id="triviaTitle">🔒 Memory Lock</h3>
    <p class="question" id="triviaQuestion"></p>
    <div class="trivia-options" id="triviaOptions"></div>
    <div class="trivia-result" id="triviaResult"></div>
    <button class="trivia-close" id="triviaClose" style="display:none;" onclick="closeTrivia()">Continue</button>
    <button class="trivia-close" id="triviaTryAgain" style="display:none;" onclick="tryAgain()">Try Again</button>
  </div>
</div>

<footer>
  <p>Made with 🤎</p>
</footer>

<script>
const grids = [
  {
    photos: [
      { src: "./dancing-in-rain.mp4", type: "video", description: "Dancing in the rain" },
      { src: "./photos/grid1-freak.jpg", description: "Buying Freak toys" },
      { src: "./photos/grid1-bottu.jpg", description: "Putting Bottu on your forehead" }
    ],
    question: "What activities were we doing the night before our day?",
    options: ["Dancing in the rain", "Buying Freak toys", "Putting Bottu on your forehead", "All the above"],
    correct: 3
  },
  {
    photos: [
      { src: "./photos/grid2/grid2-photo1.jpg", description: "" },
      { src: "./photos/grid2/grid2-photo2.jpg", description: "" },
      { src: "./photos/grid2/grid2-photo3.jpg", description: "" }
    ],
    question: "What was the first activity we partook that day?",
    options: ["Topiary Park", "Waffle Way Cafe", "Activate", "Butcher and Rose"],
    correct: 2
  },
  {
    photos: [{ src: "", description: "" }, { src: "", description: "" }, { src: "", description: "" }],
    question: "", options: ["", "", "", ""], correct: 0
  },
  {
    photos: [{ src: "", description: "" }, { src: "", description: "" }, { src: "", description: "" }],
    question: "", options: ["", "", "", ""], correct: 0
  },
  {
    photos: [{ src: "", description: "" }, { src: "", description: "" }, { src: "", description: "" }],
    question: "", options: ["", "", "", ""], correct: 0
  },
  {
    photos: [{ src: "", description: "" }, { src: "", description: "" }, { src: "", description: "" }],
    question: "", options: ["", "", "", ""], correct: 0
  }
];

const unlocked = new Set();

function init() {
  const saved = localStorage.getItem('dec29-unlocked-v3');
  if (saved) JSON.parse(saved).forEach(id => unlocked.add(id));
  renderGrids();
  updateProgress();
}

function renderGrids() {
  const container = document.getElementById('gridsContainer');
  container.innerHTML = '';
  
  grids.forEach((grid, gridIdx) => {
    const gridId = `grid-${gridIdx}`;
    const isUnlocked = unlocked.has(gridId);
    
    let photosHtml = '';
    grid.photos.forEach((photo) => {
      const hasImage = photo.src && photo.src.length > 10;
      let mediaHtml;
      
      if (isUnlocked && hasImage && photo.type === 'video') {
        mediaHtml = `<video src="${photo.src}" controls playsinline></video>`;
      } else if (isUnlocked && hasImage) {
        mediaHtml = `<img src="${photo.src}" alt="${photo.description}" />`;
      } else {
        mediaHtml = `<div class="lock-overlay"><span class="lock-icon-sm">🔒</span><p>Locked</p></div>`;
      }
      
      const infoHtml = isUnlocked && photo.description 
        ? `<div class="photo-info"><p>${photo.description}</p></div>` 
        : '';
      
      photosHtml += `
        <div class="photo-item">
          ${mediaHtml}
          ${infoHtml}
        </div>
      `;
    });
    
    const hasQuestion = grid.question && grid.question.length > 0;
    const lockHtml = (!isUnlocked && hasQuestion) ? `
      <div style="margin-top:16px; text-align:center;">
        <button class="unlock-btn" onclick="openTrivia('${gridId}', ${gridIdx})">Unlock Grid</button>
      </div>
    ` : '';
    
    container.innerHTML += `
      <div class="grid-section">
        <h3>Grid ${gridIdx + 1}</h3>
        <div class="photo-grid">${photosHtml}</div>
        ${lockHtml}
      </div>
    `;
  });
}

function updateProgress() {
  document.getElementById('progressText').textContent = `Unlocked: ${unlocked.size}/6 grids`;
  if (unlocked.size === grids.length) {
    document.getElementById('lockedSection').style.display = 'none';
  }
}

function openTrivia(gridId, gridIdx) {
  const grid = grids[gridIdx];
  if (!grid || !grid.question) return;
  
  document.getElementById('triviaTitle').textContent = '🔒 Memory Lock';
  document.getElementById('triviaQuestion').textContent = grid.question;
  
  const optsDiv = document.getElementById('triviaOptions');
  optsDiv.innerHTML = '';
  
  grid.options.forEach((opt, i) => {
    if (!opt) return;
    const btn = document.createElement('button');
    btn.className = 'trivia-option';
    btn.textContent = opt;
    btn.onclick = () => {
      const allBtns = optsDiv.querySelectorAll('.trivia-option');
      allBtns.forEach(b => b.onclick = null);
      
      if (i === grid.correct) {
        btn.classList.add('correct');
        document.getElementById('triviaResult').textContent = '🎉 Perfect! Grid unlocked!';
        document.getElementById('triviaResult').className = 'trivia-result success';
        document.getElementById('triviaClose').style.display = 'inline-block';
        document.getElementById('triviaTryAgain').style.display = 'none';
        
        unlocked.add(gridId);
        localStorage.setItem('dec29-unlocked-v3', JSON.stringify([...unlocked]));
        renderGrids();
        updateProgress();
        fireConfetti();
      } else {
        btn.classList.add('wrong');
        document.getElementById('triviaResult').textContent = 'Try again 😢';
        document.getElementById('triviaResult').className = 'trivia-result fail';
        document.getElementById('triviaClose').style.display = 'none';
        document.getElementById('triviaTryAgain').style.display = 'inline-block';
      }
    };
    optsDiv.appendChild(btn);
  });
  
  document.getElementById('triviaResult').textContent = '';
  document.getElementById('triviaResult').className = 'trivia-result';
  document.getElementById('triviaBackdrop').classList.add('show');
}

function tryAgain() {
  document.getElementById('triviaTryAgain').style.display = 'none';
}

function closeTrivia() {
  document.getElementById('triviaBackdrop').classList.remove('show');
}

function fireConfetti() {
  const colors = ['#C4944A', '#D4A853', '#C97B63', '#8B7355', '#6B4E37'];
  for (let i = 0; i < 45; i++) {
    const c = document.createElement('div');
    c.style.cssText = `position:fixed; left:${Math.random()*100}vw; top:-20px; background:${colors[Math.floor(Math.random()*colors.length)]}; border-radius:${Math.random()>0.5?'50%':'3px'}; width:${Math.random()*10+6}px; height:${Math.random()*10+6}px; z-index:200; pointer-events:none; animation:confettiFall ${Math.random()*2+1.5}s linear forwards`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

const style = document.createElement('style');
style.textContent = '@keyframes confettiFall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }';
document.head.appendChild(style);

init();
</script>

</body>
</html>
